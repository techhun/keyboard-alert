name: tmp-restock-204-probe

on:
  push:
    branches:
      - fix/restock-option-query
    paths:
      - .github/workflows/tmp-restock-204-probe.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/restock-option-query

      - name: Probe SmartStore response behavior
        shell: bash
        run: |
          set -euo pipefail
          PAGE='https://m.smartstore.naver.com/swagkey/products/12349025310'
          API='https://m.smartstore.naver.com/i/v2/channels/2sWDzGVpAyARrZx9KDRfS/products/12349025310?withWindow=false'
          UA='Mozilla/5.0 (Linux; Android 16; SM-S931N) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Mobile Safari/537.36'

          echo '=== page markers ==='
          curl -fsSL -A "$UA" "$PAGE" -o /tmp/page.html
          wc -c /tmp/page.html
          for marker in optionCombinations stockQuantity channelUid __PRELOADED_STATE__ __NEXT_DATA__; do
            if grep -q "$marker" /tmp/page.html; then
              echo "$marker=present"
            else
              echo "$marker=absent"
            fi
          done

          echo '=== repeated API status/bytes ==='
          for i in $(seq 1 20); do
            code=$(curl -sS -A "$UA" -H 'accept: application/json, text/plain, */*'               -o /tmp/api.json -w '%{http_code}' "$API")
            bytes=$(wc -c < /tmp/api.json)
            ctype=$(curl -sSI -A "$UA" "$API" | tr -d '\r' | awk -F': ' 'tolower($1)=="content-type"{print $2; exit}')
            echo "$i status=$code bytes=$bytes content-type=$ctype"
            sleep 1
          done

          echo '=== API shape ==='
          python3 - <<'PY'
          import json
          p='/tmp/api.json'
          try:
              data=json.load(open(p))
              print('top_keys=', sorted(data.keys())[:30] if isinstance(data,dict) else type(data).__name__)
              def walk(v,path='root',depth=0):
                  if depth>7: return
                  if isinstance(v,dict):
                      if 'optionCombinations' in v:
                          oc=v.get('optionCombinations')
                          print('optionCombinations_at=',path,'count=',len(oc) if isinstance(oc,list) else 'non-list')
                      for k,x in list(v.items())[:100]:
                          walk(x,path+'.'+str(k),depth+1)
                  elif isinstance(v,list):
                      for j,x in enumerate(v[:10]):
                          walk(x,path+'['+str(j)+']',depth+1)
              walk(data)
          except Exception as e:
              print('json_parse=',type(e).__name__,str(e)[:120])
          PY

      - name: Remove temporary workflow
        if: always()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/tmp-restock-204-probe.yml
          git commit -m 'chore: remove temporary Restock 204 probe'
          git push origin HEAD:fix/restock-option-query
