name: Keyboard alerts (fast)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: keyboard-alerts-fast
  cancel-in-progress: false

jobs:
  monitor-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install dependencies
        id: install
        run: npm ci --no-audit --no-fund

      - name: Signal fast heartbeat start
        env:
          HEALTHCHECKS_URL: ${{ secrets.HEALTHCHECKS_FAST_URL }}
        run: node scripts/healthchecks-ping.mjs start

      - name: Restore watcher state
        id: restore_state
        shell: bash
        run: |
          set -euo pipefail
          baseline_dir="$RUNNER_TEMP/keyboard-alert-fast-baseline"
          rm -rf "$baseline_dir"
          mkdir -p "$baseline_dir"

          git fetch origin watcher-state
          for file in guheyo-state.json dcinside-tteotnya-state.json system-health-fast.json; do
            if git cat-file -e "origin/watcher-state:$file" 2>/dev/null; then
              git show "origin/watcher-state:$file" > "$file"
              cp "$file" "$baseline_dir/$file"
            else
              rm -f "$file"
              touch "$baseline_dir/$file.missing"
            fi
          done

      - name: Check Guheyo keycap listings
        env:
          GUHEYO_NTFY_TOPIC: ${{ secrets.GUHEYO_NTFY_TOPIC }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GUHEYO_DISCORD_WEBHOOK_URL: ${{ secrets.GUHEYO_DISCORD_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SYSTEM_DISCORD_WEBHOOK_URL: ${{ secrets.SYSTEM_DISCORD_WEBHOOK_URL }}
        shell: bash
        run: |
          status=ok
          if npm run check:guheyo; then
            :
          else
            echo 'Guheyo read failed once; retrying...'
            if npm run check:guheyo; then
              :
            else
              status=fail
              echo 'Guheyo is temporarily unavailable after retries. Keeping the previous verified state and continuing.'
            fi
          fi
          npm run system:health -- transition fast guheyo "$status" '구해요 키캡' '2회 시도 후 수집에 실패했습니다. 기존 검증된 state를 유지합니다.'

      - name: Check DCInside tteotnya posts
        if: ${{ always() && steps.install.outcome == 'success' && steps.restore_state.outcome == 'success' }}
        env:
          DCINSIDE_DISCORD_WEBHOOK_URL: ${{ secrets.DCINSIDE_DISCORD_WEBHOOK_URL }}
          SYSTEM_DISCORD_WEBHOOK_URL: ${{ secrets.SYSTEM_DISCORD_WEBHOOK_URL }}
        shell: bash
        run: |
          status=ok
          if npm run check:dcinside; then
            :
          else
            status=fail
            echo 'DCInside is temporarily unavailable after its built-in retries. Keeping the previous verified state and continuing.'
          fi
          npm run system:health -- transition fast dcinside "$status" '기키갤 떴냐' '내부 재시도 후에도 수집에 실패했습니다. 기존 검증된 state를 유지합니다.'

      - name: Persist fast watcher state
        if: ${{ always() && steps.install.outcome == 'success' && steps.restore_state.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          baseline_dir="$RUNNER_TEMP/keyboard-alert-fast-baseline"
          if [ ! -d "$baseline_dir" ]; then
            echo 'Fast watcher baseline is missing; refusing to persist state.'
            exit 1
          fi

          git fetch origin watcher-state
          changed_files=()
          for file in guheyo-state.json dcinside-tteotnya-state.json system-health-fast.json; do
            if [ ! -f "$file" ]; then
              continue
            fi

            baseline="$baseline_dir/$file"
            missing_marker="$baseline_dir/$file.missing"

            if [ -f "$baseline" ]; then
              if cmp -s "$file" "$baseline"; then
                continue
              fi
              if ! git cat-file -e "origin/watcher-state:$file" 2>/dev/null; then
                echo "Remote watcher state removed $file after restore; refusing stale overwrite."
                exit 1
              fi
              if ! cmp -s "$baseline" <(git show "origin/watcher-state:$file"); then
                echo "Remote watcher state changed $file after restore; refusing stale overwrite."
                exit 1
              fi
            elif [ -f "$missing_marker" ]; then
              if git cat-file -e "origin/watcher-state:$file" 2>/dev/null; then
                echo "Remote watcher state created $file after restore; refusing stale overwrite."
                exit 1
              fi
            else
              echo "No restore baseline found for $file; refusing to persist."
              exit 1
            fi

            changed_files+=("$file")
          done

          if [ ${#changed_files[@]} -eq 0 ]; then
            echo 'Fast watcher state unchanged.'
            exit 0
          fi

          state_dir="$RUNNER_TEMP/keyboard-alert-watcher-state-fast"
          rm -rf "$state_dir"
          git worktree add -B watcher-state "$state_dir" origin/watcher-state

          for file in "${changed_files[@]}"; do
            cp "$file" "$state_dir/$file"
          done

          git -C "$state_dir" config user.name 'github-actions[bot]'
          git -C "$state_dir" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "$state_dir" add "${changed_files[@]}"
          if git -C "$state_dir" diff --cached --quiet -- "${changed_files[@]}"; then
            echo 'Fast watcher state unchanged after staging.'
            exit 0
          fi
          git -C "$state_dir" commit -m 'Update fast watcher state'

          for attempt in 1 2 3; do
            if git -C "$state_dir" pull --rebase origin watcher-state && git -C "$state_dir" push origin HEAD:watcher-state; then
              exit 0
            fi
            git -C "$state_dir" rebase --abort >/dev/null 2>&1 || true
            echo "Fast state push attempt ${attempt} failed; retrying..."
            sleep $((attempt * 2))
          done

          echo 'Failed to persist fast watcher state after retries.'
          exit 1

      - name: Signal fast heartbeat success
        if: success()
        env:
          HEALTHCHECKS_URL: ${{ secrets.HEALTHCHECKS_FAST_URL }}
        run: node scripts/healthchecks-ping.mjs success

      - name: Signal fast heartbeat failure
        if: failure()
        env:
          HEALTHCHECKS_URL: ${{ secrets.HEALTHCHECKS_FAST_URL }}
        run: node scripts/healthchecks-ping.mjs fail

      - name: Alert on fast workflow failure
        if: failure()
        env:
          SYSTEM_DISCORD_WEBHOOK_URL: ${{ secrets.SYSTEM_DISCORD_WEBHOOK_URL }}
        run: npm run system:health -- incident 'Fast workflow' 'GitHub Actions 실행 자체가 실패했습니다. 실행 로그를 확인하세요.'
