name: Android Restock Worker APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/restock-worker/**'
      - '.github/workflows/android-restock-worker.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: android/restock-worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: restock-worker-debug-keystore-v1

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Lint and build debug APK
        run: gradle :app:lintDebug :app:assembleDebug --stacktrace

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: restock-worker-lint
          path: android/restock-worker/app/build/reports/lint-results-debug.*
          if-no-files-found: warn
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: restock-worker-debug-apk
          path: android/restock-worker/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
