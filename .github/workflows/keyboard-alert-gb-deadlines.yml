name: Keyboard Alert · GB closing reminders

on:
  schedule:
    # Separate from 1-minute/10-minute collectors. 09:15 KST every day.
    - cron: '15 0 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only count eligible GB deadlines (no Discord messages or state writes)"
        required: true
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: keyboard-alert-gb-closing-reminders
  cancel-in-progress: false

jobs:
  gb-closing:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Snapshot verified source schedules from watcher-state
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/watcher-state:refs/remotes/origin/watcher-state
          git show origin/watcher-state:geonworks-release-state.json > "$RUNNER_TEMP/geonworks-release-state.json"
          git show origin/watcher-state:swagkeys-state.json > "$RUNNER_TEMP/swagkeys-state.json"
          node -e "const fs=require('node:fs'); for(const name of ['geonworks-release-state.json','swagkeys-state.json']) { const x=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/'+name,'utf8')); if(x.version!==1||!x.initialized||!x.updatedAt)process.exit(1); console.log(name, 'updatedAt',x.updatedAt); }"

      - name: Calculate GB closing reminders
        env:
          GEONWORKS_DISCORD_WEBHOOK_URL: ${{ secrets.GEONWORKS_DISCORD_WEBHOOK_URL }}
          SWAGKEYS_DISCORD_WEBHOOK_URL: ${{ secrets.SWAGKEYS_DISCORD_WEBHOOK_URL }}
          SWG_DISCORD_WEBHOOK_URL: ${{ secrets.SWG_DISCORD_WEBHOOK_URL }}
          GEON_RELEASE_STATE_PATH: ${{ runner.temp }}/geonworks-release-state.json
          SWAGKEYS_STATE_PATH: ${{ runner.temp }}/swagkeys-state.json
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
        run: node scripts/check-gb-deadlines.mjs
