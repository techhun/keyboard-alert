name: Oblotzky one-shot notification test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oblotzky-one-shot-test.yml'

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Send latest Oblotzky row as test notification
        env:
          OBLOTZKY_DISCORD_WEBHOOK_URL: ${{ secrets.OBLOTZKY_DISCORD_WEBHOOK_URL }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { parseOblotzkyScheduleHtml } from './scripts/oblotzky-safety.mjs';

          const PAGE_URL = 'https://oblotzky.industries/pages/schedule';
          const webhook = (process.env.OBLOTZKY_DISCORD_WEBHOOK_URL || '').trim();
          if (!webhook) throw new Error('OBLOTZKY_DISCORD_WEBHOOK_URL secret is not configured');

          const response = await fetch(PAGE_URL, {
            headers: {
              accept: 'text/html,application/xhtml+xml',
              'user-agent': 'keyboard-alert/1.0 (+https://github.com/techhun/keyboard-alert)'
            },
            signal: AbortSignal.timeout(15000)
          });
          if (!response.ok) throw new Error(`Oblotzky schedule HTTP ${response.status}`);

          const rows = parseOblotzkyScheduleHtml(await response.text());
          const dated = rows
            .map((row) => ({ row, time: Date.parse(row.lastUpdated) }))
            .filter(({ time }) => Number.isFinite(time))
            .sort((a, b) => b.time - a.time || a.row.project.localeCompare(b.row.project));

          if (!dated.length) throw new Error('No parsable Oblotzky Last Updated values found');
          const latest = dated[0].row;

          const payload = {
            username: 'Oblotzky Alert',
            allowed_mentions: { parse: [] },
            embeds: [{
              title: `🧪 테스트 · Oblotzky 최근 변경 · ${latest.project}`,
              url: PAGE_URL,
              description: '최근 갱신일 기준 1건 테스트 알림입니다. 운영 state는 변경하지 않습니다.',
              fields: [
                { name: '마지막 갱신', value: latest.lastUpdated || '—', inline: true },
                { name: '상태', value: latest.status || '—', inline: false }
              ],
              footer: { text: 'Oblotzky Industries · 1회 테스트' },
              timestamp: new Date().toISOString()
            }]
          };

          const sent = await fetch(webhook, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          if (!sent.ok) throw new Error(`Discord webhook failed: ${sent.status} ${await sent.text()}`);

          console.log(`Sent one-shot Oblotzky test: ${latest.project} | ${latest.lastUpdated} | ${latest.status}`);
          NODE
