name: Validate Keepodd sale dates

on:
  push:
    branches:
      - keepodd-sale-dates-20261013
    paths:
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/validate-keepodd-sale-dates.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci --no-audit --no-fund
      - run: npm test
