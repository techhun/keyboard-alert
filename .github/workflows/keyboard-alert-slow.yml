name: Keyboard alerts (slow)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: keyboard-alerts-slow
  cancel-in-progress: false

jobs:
  monitor-slow:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Signal slow heartbeat start
        env:
          HEALTHCHECKS_URL: ${{ secrets.HEALTHCHECKS_SLOW_URL }}
        run: node scripts/healthchecks-ping.mjs start

      - name: Restore watcher state
        shell: bash
        run: |
          git fetch origin watcher-state
          for file in geonworks-state.json geonworks-release-state.json prototypist-state.json swagkeys-state.json oblotzky-state.json novelkeys-state.json kbdfans-state.json cannonkeys-state.json deskhero-state.json omnitype-state.json system-health-slow.json; do
            if git cat-file -e "origin/watcher-state:$file" 2>/dev/null; then
              git show "origin/watcher-state:$file" > "$file"
            fi
          done

      - name: Run regression tests
        run: npm test

      - name: Check GEONWORKS GB schedule
        env:
          GEONWORKS_DISCORD_WEBHOOK_URL: ${{ secrets.GEONWORKS_DISCORD_WEBHOOK_URL }}
          SYSTEM_DISCORD_WEBHOOK_URL: ${{ secrets.SYSTEM_DISCORD_WEBHOOK_URL }}
        shell: bash
        run: |
          status=ok
          if npm run check:geonworks; then
            :
          else
            echo 'GEONWORKS GB read failed once; retrying...'
            if npm run check:geonworks; then
              :
            else
              status=fail
              echo 'GEONWORKS GB is temporarily unavailable after retries. Keeping the previous verified state and continuing.'
            fi
          fi
          npm run system:health -- transition slow geonworks-gb "$status" 'GEONWORKS GB' '2회 시도 후 수집에 실패했습니다. 기존 검증된 state를 유지합니다.'

      - name: Check GEONWORKS Release schedule
        if: always()
        env:
          GEONWORKS_DISCORD_WEBHOOK_URL: ${{ secrets.GEONWORKS_DISCORD_WEBHOOK_URL }}
          SYSTEM_DISCORD_WEBHOOK_URL: ${{ secrets.SYSTEM_DISCORD_WEBHOOK_URL }}
        shell: bash
        run: |
          status=ok
          if npm run check:geonworks-release; then
            :
          else
            echo 'GEONWORKS Release read failed once; retrying...'
            if npm run check:geonworks-release; then
              :
            else
              status=fail
              echo 'GEONWORKS Release is temporarily unavailable after retries. Keeping the previous verified state and continuing.'
            fi
          fi
          npm run system:health -- transition slow geonworks-release "$status" 'GEONWORKS Release' '2회 시도 후 수집에 실패했습니다. 기존 검증된 state를 유지합니다.'

      - name: Check ProtoTypist updates
        if: always()
        env:
          PROTOTYPIST_DISCORD_WEBHOOK_URL: ${{ secrets.PROTOTYPIST_DISCORD_WEBHOOK_URL }}
          SYSTEM_DISCORD_WEBHOOK_URL: ${{ secrets.SYSTEM_DISCORD_WEBHOOK_URL }}
        shell: bash
        run: |
          status=ok
          if npm run check:prototypist; then
            :
          else
            status=fail
            echo 'ProtoTypist is temporarily unavailable after its built-in retries. Keeping the previous verified state and continuing.'
          fi
          npm run system:health -- transition slow prototypist "$status" 'ProtoTypist' '내부 재시도 후에도 수집에 실패했습니다. 기존 검증된 state를 유지합니다.'

      - name: Check SWAGKEYS roadmap
        if: always()
        env:
          SWAGKEYS_DISCORD_WEBHOOK_URL: ${{ secrets.SWAGKEYS_DISCORD_WEBHOOK_URL }}
          SWG_DISCORD_WEBHOOK_URL: ${{ secrets.SWG_DISCORD_WEBHOOK_URL }}
          SYSTEM_DISCORD_WEBHOOK_URL: ${{ secrets.SYSTEM_DISCORD_WEBHOOK_URL }}
        shell: bash
        run: |
          status=ok
          if npm run check:swagkeys; then
            if node -e "const fs=require('fs'); const s=JSON.parse(fs.readFileSync('swagkeys-state.json','utf8')); process.exit(Object.keys(s.fallbackSince || {}).length ? 0 : 1)"; then
              status=degraded
              echo 'SWAGKEYS is using a bounded stored fallback. Health state will not be recovered or reset by this run.'
            fi
          else
            status=fail
            echo 'SWAGKEYS is temporarily unavailable after its built-in retries. Keeping the previous verified state and continuing.'
          fi
          npm run system:health -- transition slow swagkeys "$status" 'SWAGKEYS' '내부 재시도 후에도 수집에 실패했습니다. 기존 검증된 state를 유지합니다.'

      - name: Check Oblotzky schedule
        if: always()
        env:
          OBLOTZKY_DISCORD_WEBHOOK_URL: ${{ secrets.OBLOTZKY_DISCORD_WEBHOOK_URL }}
          SYSTEM_DISCORD_WEBHOOK_URL: ${{ secrets.SYSTEM_DISCORD_WEBHOOK_URL }}
        shell: bash
        run: |
          status=ok
          if npm run check:oblotzky; then
            :
          else
            echo 'Oblotzky read failed once; retrying...'
            if npm run check:oblotzky; then
              :
            else
              status=fail
              echo 'Oblotzky is temporarily unavailable after retries. Keeping the previous verified state and continuing.'
            fi
          fi
          npm run system:health -- transition slow oblotzky "$status" 'Oblotzky' '2회 시도 후 수집에 실패했습니다. 기존 검증된 state를 유지합니다.'

      - name: Check NovelKeys product updates
        if: always()
        env:
          NOVELKEYS_DISCORD_WEBHOOK_URL: ${{ secrets.NOVELKEYS_DISCORD_WEBHOOK_URL }}
          SYSTEM_DISCORD_WEBHOOK_URL: ${{ secrets.SYSTEM_DISCORD_WEBHOOK_URL }}
        shell: bash
        run: |
          status=ok
          if npm run check:novelkeys; then
            :
          else
            echo 'NovelKeys read failed once; retrying...'
            if npm run check:novelkeys; then
              :
            else
              status=fail
              echo 'NovelKeys is temporarily unavailable after retries. Keeping the previous verified state and continuing.'
            fi
          fi
          npm run system:health -- transition slow novelkeys "$status" 'NovelKeys' '2회 시도 후 수집에 실패했습니다. 기존 검증된 state를 유지합니다.'

      - name: Check KBDfans product updates
        if: always()
        env:
          KBDFANS_DISCORD_WEBHOOK_URL: ${{ secrets.KBDFANS_DISCORD_WEBHOOK_URL }}
          SYSTEM_DISCORD_WEBHOOK_URL: ${{ secrets.SYSTEM_DISCORD_WEBHOOK_URL }}
        shell: bash
        run: |
          status=ok
          if npm run check:kbdfans; then
            :
          else
            echo 'KBDfans read failed once; retrying...'
            if npm run check:kbdfans; then
              :
            else
              status=fail
              echo 'KBDfans is temporarily unavailable after retries. Keeping the previous verified state and continuing.'
            fi
          fi
          npm run system:health -- transition slow kbdfans "$status" 'KBDfans' '2회 시도 후 수집에 실패했습니다. 기존 검증된 state를 유지합니다.'

      - name: Check CannonKeys project updates
        if: always()
        env:
          CANNONKEYS_DISCORD_WEBHOOK_URL: ${{ secrets.CANNONKEYS_DISCORD_WEBHOOK_URL }}
          SYSTEM_DISCORD_WEBHOOK_URL: ${{ secrets.SYSTEM_DISCORD_WEBHOOK_URL }}
        shell: bash
        run: |
          status=ok
          if npm run check:cannonkeys; then
            :
          else
            echo 'CannonKeys read failed once; retrying...'
            if npm run check:cannonkeys; then
              :
            else
              status=fail
              echo 'CannonKeys is temporarily unavailable after retries. Keeping the previous verified state and continuing.'
            fi
          fi
          npm run system:health -- transition slow cannonkeys "$status" 'CannonKeys' '2회 시도 후 수집에 실패했습니다. 기존 검증된 state를 유지합니다.'

      - name: Check Deskhero Group Buy/Preorder updates
        if: always()
        env:
          DESKHERO_DISCORD_WEBHOOK_URL: ${{ secrets.DESKHERO_DISCORD_WEBHOOK_URL }}
          SYSTEM_DISCORD_WEBHOOK_URL: ${{ secrets.SYSTEM_DISCORD_WEBHOOK_URL }}
        shell: bash
        run: |
          status=ok
          if npm run check:deskhero; then
            :
          else
            echo 'Deskhero read failed once; retrying...'
            if npm run check:deskhero; then
              :
            else
              status=fail
              echo 'Deskhero is temporarily unavailable after retries. Keeping the previous verified state and continuing.'
            fi
          fi
          npm run system:health -- transition slow deskhero "$status" 'Deskhero' '2회 시도 후 수집에 실패했습니다. 기존 검증된 state를 유지합니다.'

      - name: Check Omnitype Product Updates
        if: always()
        env:
          OMNITYPE_DISCORD_WEBHOOK_URL: ${{ secrets.OMNITYPE_DISCORD_WEBHOOK_URL }}
          SYSTEM_DISCORD_WEBHOOK_URL: ${{ secrets.SYSTEM_DISCORD_WEBHOOK_URL }}
        shell: bash
        run: |
          status=ok
          if npm run check:omnitype; then
            :
          else
            echo 'Omnitype read failed once; retrying...'
            if npm run check:omnitype; then
              :
            else
              status=fail
              echo 'Omnitype is temporarily unavailable after retries. Keeping the previous verified state and continuing.'
            fi
          fi
          npm run system:health -- transition slow omnitype "$status" 'Omnitype' '2회 시도 후 수집에 실패했습니다. 기존 검증된 state를 유지합니다.'

      - name: Persist slow watcher state
        if: always()
        shell: bash
        run: |
          git fetch origin watcher-state
          changed_files=()
          for file in geonworks-state.json geonworks-release-state.json prototypist-state.json swagkeys-state.json oblotzky-state.json novelkeys-state.json kbdfans-state.json cannonkeys-state.json deskhero-state.json omnitype-state.json system-health-slow.json; do
            if [ -f "$file" ] && ! git diff --quiet origin/watcher-state -- "$file"; then
              changed_files+=("$file")
            fi
          done
          if [ ${#changed_files[@]} -eq 0 ]; then
            echo 'Slow watcher state unchanged.'
            exit 0
          fi

          state_dir="/tmp/keyboard-alert-watcher-state-slow"
          rm -rf "$state_dir"
          git worktree add -B watcher-state "$state_dir" origin/watcher-state

          for file in "${changed_files[@]}"; do
            cp "$file" "$state_dir/$file"
          done

          git -C "$state_dir" config user.name 'github-actions[bot]'
          git -C "$state_dir" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "$state_dir" add "${changed_files[@]}"
          git -C "$state_dir" commit -m 'Update slow watcher state'

          for attempt in 1 2 3; do
            if git -C "$state_dir" pull --rebase origin watcher-state && git -C "$state_dir" push origin HEAD:watcher-state; then
              exit 0
            fi
            git -C "$state_dir" rebase --abort >/dev/null 2>&1 || true
            echo "Slow state push attempt ${attempt} failed; retrying..."
            sleep $((attempt * 2))
          done

          echo 'Failed to persist slow watcher state after retries.'
          exit 1

      - name: Signal slow heartbeat success
        if: success()
        env:
          HEALTHCHECKS_URL: ${{ secrets.HEALTHCHECKS_SLOW_URL }}
        run: node scripts/healthchecks-ping.mjs success

      - name: Signal slow heartbeat failure
        if: failure()
        env:
          HEALTHCHECKS_URL: ${{ secrets.HEALTHCHECKS_SLOW_URL }}
        run: node scripts/healthchecks-ping.mjs fail

      - name: Alert on slow workflow failure
        if: failure()
        env:
          SYSTEM_DISCORD_WEBHOOK_URL: ${{ secrets.SYSTEM_DISCORD_WEBHOOK_URL }}
        run: npm run system:health -- incident 'Slow workflow' 'GitHub Actions 실행 자체가 실패했습니다. 실행 로그를 확인하세요.'
