name: KBDfans inspect

on:
  push:
    branches: [feat/kbdfans-alert]
    paths:
      - '.github/workflows/kbdfans-inspect.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect KBDfans Product Updates HTML
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const url='https://kbdfans.com/apps/kbd-notify/product-updates';
          const r=await fetch(url,{headers:{'user-agent':'keyboard-alert/1.0','accept':'text/html'}});
          console.log('status',r.status);
          const html=await r.text();
          console.log('bytes',html.length);
          for (const needle of ['PBTfans G3','TOFU TKL R2','Project progress','View updates','Current status','KEYBOARDS','KEYCAPS']) {
            const i=html.indexOf(needle);
            console.log('\n--- '+needle+' @ '+i+' ---');
            console.log(i>=0 ? html.slice(Math.max(0,i-1400),Math.min(html.length,i+2400)).replace(/\s+/g,' ') : 'not found');
          }
          NODE
