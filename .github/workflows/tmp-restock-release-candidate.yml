name: Restock 0.14.10 Release Candidate

on:
  push:
    branches: [fix/restock-option-query]
    paths:
      - '.github/workflows/tmp-restock-release-candidate.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: android/restock-worker
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'
      - name: Restore release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.RESTOCK_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RESTOCK_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RESTOCK_RELEASE_KEY_ALIAS }}
        shell: bash
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          keystore_path="$RUNNER_TEMP/restock-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          echo "RESTOCK_KEYSTORE_PATH=$keystore_path" >> "$GITHUB_ENV"
          echo "RESTOCK_KEYSTORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "RESTOCK_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "RESTOCK_KEY_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
      - name: Test, lint and build signed release APK
        run: gradle :app:testDebugUnitTest :app:lintRelease :app:assembleRelease --stacktrace
      - name: Upload release APK
        uses: actions/upload-artifact@v7
        with:
          name: restock-0.14.10-release-candidate
          path: android/restock-worker/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7
      - name: Remove temporary workflow
        if: always()
        working-directory: .
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/tmp-restock-release-candidate.yml
          git commit -m 'chore: remove temporary Restock release candidate workflow'
          git push origin HEAD:fix/restock-option-query
