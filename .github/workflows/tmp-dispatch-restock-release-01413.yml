name: tmp-dispatch-restock-release-01413

on:
  push:
    branches:
      - fix/restock-option-query
    paths:
      - .github/workflows/tmp-dispatch-restock-release-01413.yml

permissions:
  actions: write
  contents: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/restock-option-query

      - name: Dispatch existing release workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run android-restock-release.yml --ref fix/restock-option-query

      - name: Remove temporary dispatcher
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/tmp-dispatch-restock-release-01413.yml
          git commit -m 'chore: remove temporary 0.14.13 release dispatcher'
          git push origin HEAD:fix/restock-option-query
