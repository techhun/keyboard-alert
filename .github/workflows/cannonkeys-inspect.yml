name: CannonKeys inspect

on:
  push:
    branches: [feat/cannonkeys-alert]
    paths:
      - '.github/workflows/cannonkeys-inspect.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect CannonKeys API base
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const src='https://cdn.shopify.com/s/files/1/0238/7342/1376/files/main.e19fb963.js?v=1715695075';
          const r=await fetch(src);
          const js=await r.text();
          for(const needle of ['backend.cannonkeys.com','api/v1/public/updates/','fetchUpdates']){
            let from=0,count=0;
            while(count<5){
              const i=js.indexOf(needle,from);
              if(i<0) break;
              console.log('\n--- '+needle+' @ '+i+' ---');
              console.log(js.slice(Math.max(0,i-1200),Math.min(js.length,i+2200)));
              from=i+needle.length;
              count++;
            }
          }
          NODE
