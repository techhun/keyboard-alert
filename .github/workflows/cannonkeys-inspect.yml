name: CannonKeys inspect

on:
  push:
    branches: [feat/cannonkeys-alert]
    paths:
      - '.github/workflows/cannonkeys-inspect.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect CannonKeys update app bundle
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const src='https://cdn.shopify.com/s/files/1/0238/7342/1376/files/main.e19fb963.js?v=1715695075';
          const r=await fetch(src,{headers:{'user-agent':'keyboard-alert/1.0'}});
          console.log('status',r.status);
          const js=await r.text();
          console.log('bytes',js.length);
          const strings=[...js.matchAll(/["'`](.{0,200}?(?:project|status|update|api|graphql|airtable|notion).{0,200}?)["'`]/gi)].map(m=>m[1]);
          for(const s of [...new Set(strings)].slice(0,200)) console.log('str',s.replace(/\s+/g,' '));
          const urls=[...js.matchAll(/https?:\\?\/\\?\/[^"'\s<>]+/gi)].map(m=>m[0]);
          for(const u of [...new Set(urls)].slice(0,100)) console.log('url',u);
          NODE
