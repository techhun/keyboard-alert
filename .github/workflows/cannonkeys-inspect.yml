name: CannonKeys inspect

on:
  push:
    branches: [feat/cannonkeys-alert]
    paths:
      - '.github/workflows/cannonkeys-inspect.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect CannonKeys public update responses
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const base='https://backend.cannonkeys.com/api/v1/public/updates/';
          const indexResp=await fetch(base+'index',{headers:{accept:'application/json','user-agent':'keyboard-alert/1.0'}});
          console.log('index status',indexResp.status);
          const index=await indexResp.json();
          console.log('index isArray',Array.isArray(index),'length',index?.length);
          console.log('index sample',JSON.stringify(index?.slice?.(0,8) ?? index,null,2));

          const ids=(Array.isArray(index)?index:[]).slice(0,5).map(x=>x.id).filter(Boolean);
          const bulkResp=await fetch(base+'bulk?ids='+encodeURIComponent(ids.join(',')),{headers:{accept:'application/json','user-agent':'keyboard-alert/1.0'}});
          console.log('bulk status',bulkResp.status);
          const bulk=await bulkResp.json();
          console.log('bulk',JSON.stringify(bulk,null,2).slice(0,18000));
          NODE
