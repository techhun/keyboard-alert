name: CannonKeys inspect

on:
  push:
    branches: [feat/cannonkeys-alert]
    paths:
      - '.github/workflows/cannonkeys-inspect.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect CannonKeys public updates API
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const url='https://backend.cannonkeys.com/api/v1/public/updates/';
          const r=await fetch(url,{headers:{'user-agent':'keyboard-alert/1.0','accept':'application/json'}});
          console.log('status',r.status);
          console.log('content-type',r.headers.get('content-type'));
          const text=await r.text();
          console.log('bytes',text.length);
          console.log(text.slice(0,12000));
          NODE
