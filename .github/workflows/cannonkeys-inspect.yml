name: CannonKeys inspect

on:
  push:
    branches: [feat/cannonkeys-alert]
    paths:
      - '.github/workflows/cannonkeys-inspect.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect CannonKeys Project Updates HTML
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const url='https://cannonkeys.com/pages/project-updates';
          const r=await fetch(url,{headers:{'user-agent':'keyboard-alert/1.0','accept':'text/html'}});
          console.log('status',r.status);
          const html=await r.text();
          console.log('bytes',html.length);
          for (const needle of ['Project Updates','Search for a project','project-status','project_status','projectStatus','project updates','projectUpdates','project_updates','Ordered','Manufacturing','En Route','Shipping','Complete','Keyboards','Keysets','Deskmats']) {
            const i=html.indexOf(needle);
            console.log('\n--- '+needle+' @ '+i+' ---');
            console.log(i>=0 ? html.slice(Math.max(0,i-1600),Math.min(html.length,i+3000)).replace(/\s+/g,' ') : 'not found');
          }
          NODE
