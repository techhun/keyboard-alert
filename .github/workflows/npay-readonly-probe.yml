              private boolean isLoginPage(String address){
                  try{Uri u=Uri.parse(address);return "https".equals(u.getScheme())&&"nid.naver.com".equals(u.getHost())&&"/nidlogin.login".equals(u.getPath());}
                  catch(Exception ignored){return false;}
              }
              private boolean isHistoryPage(String address){
                  try{Uri u=Uri.parse(address);return "https".equals(u.getScheme())&&"pay.naver.com".equals(u.getHost())&&("/history".equals(u.getPath())||"/history/".equals(u.getPath())||"/pc/history".equals(u.getPath())||"/pc/history/".equals(u.getPath()));}
                  catch(Exception ignored){return false;}
              }
              private boolean isLoginReturn(String address){
                  try{Uri u=Uri.parse(address);String h=u.getHost(),p=u.getPath();
                      return "https".equals(u.getScheme())&&u.getUserInfo()==null&&
                          ("pay.naver.com".equals(h)||(("www.naver.com".equals(h)||"m.naver.com".equals(h)||"naver.com".equals(h))&&(p==null||p.isEmpty()||"/".equals(p))));
                  }catch(Exception ignored){return false;}
              }
              private String loginAddress(String address){
                  if(!isLoginPage(address))return address;
                  Uri u=Uri.parse(address);Uri.Builder b=u.buildUpon().clearQuery();
                  for(String key:u.getQueryParameterNames())if(!"url".equals(key))
                      for(String value:u.getQueryParameters(key))b.appendQueryParameter(key,value);
                  return b.appendQueryParameter("url",URL).build().toString();
              }
              private boolean navigate(String address){
                  try {
                      Uri uri=Uri.parse(address);
                      String scheme=uri.getScheme();
                      if("https".equalsIgnoreCase(scheme)){
                          String host=uri.getHost();
                          if(host==null||!(host.equals("naver.com")||host.endsWith(".naver.com")))return true;
                          if(isLoginPage(address)){
                              loginReturnPending=true;
                              String target=loginAddress(address);
                              if(!target.equals(address)){browser.loadUrl(target);return true;}
                          }
                          return false;
                      }
                      if("nidlogin".equalsIgnoreCase(scheme)){
                          Intent intent=new Intent(Intent.ACTION_VIEW,uri);
                          intent.setPackage("com.nhn.android.search");
                          try{startActivity(intent);}catch(Exception e){pageStatus.setText("페이지: 네이버 웹 화면에서 로그인해줘.");}
                      }
                  } catch(Exception ignored){}
                  return true;
              }
              private String safeHost(String address){
                  try {String host=Uri.parse(address).getHost();return host==null?"호스트 없음":host;}
                  catch(Exception e){return "호스트 확인 불가";}
              }
              private String safePage(String address){
                  String host=safeHost(address);
                  if(!"pay.naver.com".equals(host))return host+" · 경로 숨김";
                  try{
                      String path=Uri.parse(address).getPath();
                      String[] known={"/pc/history","/history","/m/history","/historybenefit/paymenthistory"};
                      for(String route:known){
                          if(route.equals(path)||(route+"/").equals(path))return host+route;
                      }
                      return host+" · 기타 경로(숨김)";
                  }catch(Exception e){return host+" · 경로 확인 불가";}
              }
