name: NPay Readonly Probe APK
run-name: NPay probe v0.1.21 bounded multiple-delivery-button background probe

on:
  push:
    branches:
      - test/npay-readonly-probe
    paths:
      - .github/workflows/npay-readonly-probe.yml
      - .github/npay-probe/BackgroundProbeService.java
      - .github/npay-probe/BackgroundDeliveryScripts.java

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'
      - name: Set up isolated debug APK project
        shell: bash
        run: |
          set -euo pipefail
          cp -r android/restock-worker android/npay-probe-ci
          rm -rf android/npay-probe-ci/app/src/main/java
          rm -rf android/npay-probe-ci/app/src/test
          mkdir -p android/npay-probe-ci/app/src/main/java/com/techhun/keyboardalert/restock
          sed -i 's/applicationId = "com.techhun.keyboardalert.restock"/applicationId = "com.techhun.npayprobe"/' android/npay-probe-ci/app/build.gradle.kts
          sed -i 's/versionName = "0.14.10"/versionName = "0.1.21-probe"/' android/npay-probe-ci/app/build.gradle.kts
          sed -i -E 's/versionCode = [0-9]+/versionCode = 121/' android/npay-probe-ci/app/build.gradle.kts
          cat > android/npay-probe-ci/app/src/main/AndroidManifest.xml <<'MANIFEST'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />
            <uses-permission android:name="android.permission.WAKE_LOCK" />
            <application android:label="NPay 조회 테스트" android:usesCleartextTraffic="false" android:allowBackup="false">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN" />
                  <category android:name="android.intent.category.LAUNCHER" />
                </intent-filter>
              </activity>
              <service android:name=".BackgroundProbeService" android:exported="false" android:foregroundServiceType="specialUse">
                <property android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                  android:value="User-initiated one-time background verification of the NPay shopping list." />
              </service>
            </application>
          </manifest>
          MANIFEST
          cat > android/npay-probe-ci/app/src/main/java/com/techhun/keyboardalert/restock/MainActivity.java <<'JAVA'
          package com.techhun.keyboardalert.restock;

          import android.annotation.SuppressLint;
          import android.app.Activity;
          import android.content.Intent;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.widget.Toast;
          import android.view.View;
          import android.webkit.CookieManager;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import org.json.JSONArray;
          import org.json.JSONObject;

          public class MainActivity extends Activity {
              private boolean loginReturnPending=false;
              private static final int BACKGROUND_NOTIFICATION_REQUEST=7188;
              private TextView backgroundResult;
              private boolean backgroundAllPending=false,backgroundSamplePending=false,
                  backgroundMultiPending=false;
              private void refreshBackgroundResult(){
                  if(backgroundResult!=null)backgroundResult.setText("백그라운드 조회: "+
                      getSharedPreferences(BackgroundProbeService.PREFS,MODE_PRIVATE)
                          .getString(BackgroundProbeService.STATUS,"아직 실행하지 않음"));
              }
              private void startBackgroundProbe(boolean allPages,boolean sampleShipping,boolean multi){
                  if(autoRunning||sweeping){status.setText("진행 중인 화면 검사를 먼저 중지해줘.");return;}
                  if(getSharedPreferences(BackgroundProbeService.PREFS,MODE_PRIVATE).getBoolean("running",false)){
                      refreshBackgroundResult();return;
                  }
                  backgroundAllPending=allPages;
                  backgroundSamplePending=sampleShipping;
                  backgroundMultiPending=multi;
                  if(android.os.Build.VERSION.SDK_INT>=33&&
                      checkSelfPermission(android.Manifest.permission.POST_NOTIFICATIONS)!=android.content.pm.PackageManager.PERMISSION_GRANTED){
                      requestPermissions(new String[]{android.Manifest.permission.POST_NOTIFICATIONS},BACKGROUND_NOTIFICATION_REQUEST);
                      return;
                  }
                  try{
                      Intent intent=new Intent(this,BackgroundProbeService.class);
                      if(allPages)intent.setAction(BackgroundProbeService.ACTION_SCAN_ALL);
                      if(sampleShipping)intent.setAction(multi?
                          BackgroundProbeService.ACTION_SHIP_MULTI:BackgroundProbeService.ACTION_SHIP_SAMPLE);
                      startForegroundService(intent);
                      backgroundResult.setText("백그라운드 조회: "+
                          (sampleShipping?(multi?"묶음배송 버튼 최대 3개 검사":"배송정보 최대 6건 시범"):
                              allPages?"전체 구매목록 검사":"1페이지 검사")+
                          " 시작 요청 · 홈 화면/잠금 전환 후 확인");
                  }catch(RuntimeException e){backgroundResult.setText("백그라운드 조회: 시작 불가 · Android 서비스 제한");}
              }
              @Override public void onRequestPermissionsResult(int code,String[] permissions,int[] grants){
                  super.onRequestPermissionsResult(code,permissions,grants);
                  if(code!=BACKGROUND_NOTIFICATION_REQUEST)return;
                  if(grants.length>0&&grants[0]==android.content.pm.PackageManager.PERMISSION_GRANTED)
                      startBackgroundProbe(backgroundAllPending,backgroundSamplePending,backgroundMultiPending);
                  else if(backgroundResult!=null)backgroundResult.setText("백그라운드 조회: 알림 권한이 필요합니다");
              }
              @Override protected void onResume(){
                  super.onResume();
                  getSharedPreferences(BackgroundProbeService.PREFS,MODE_PRIVATE).edit()
                      .putBoolean("ui_visible",true).apply();
                  refreshBackgroundResult();
              }
              @Override protected void onPause(){
                  getSharedPreferences(BackgroundProbeService.PREFS,MODE_PRIVATE).edit()
                      .putBoolean("ui_visible",false).apply();
                  super.onPause();
              }
              private static final String URL = "https://pay.naver.com/pc/history?page=1&serviceChannel=SHOPPING";
              private final java.util.LinkedHashMap<String,String> detailIds=new java.util.LinkedHashMap<>();
              private int autoCancelled=0;
              private boolean targetCancelled=false;
              private final java.util.LinkedHashMap<String,String> detailLabels=new java.util.LinkedHashMap<>();
              private final java.util.ArrayList<ReportRow> reportRows=new java.util.ArrayList<>();
              private final java.util.LinkedHashSet<String> orderReasons=new java.util.LinkedHashSet<>();
              private final java.util.ArrayList<String> buttonNotes=new java.util.ArrayList<>();
              private final java.util.HashSet<String> observedButtonPairs=new java.util.HashSet<>();
              private String buttonNote="",reportSummary="";
              private static class ReportRow {
                  final String label,state,details,address;
                  ReportRow(String l,String s,String d,String a){label=l;state=s;details=d;address=a;}
              }
              // Compact identical displayed results, but never skip inspection of controls.
              private String conciseButtonNotes(){
                  if(buttonNotes.size()<4)return android.text.TextUtils.join(System.lineSeparator(),buttonNotes);
                  String first=buttonValue(buttonNotes.get(0));
                  if(first.isEmpty())return android.text.TextUtils.join(System.lineSeparator(),buttonNotes);
                  for(String item:buttonNotes)if(!first.equals(buttonValue(item)))
                      return android.text.TextUtils.join(System.lineSeparator(),buttonNotes);
                  return "배송조회 1~"+buttonNotes.size()+": "+first+
                      " (각 버튼 검사 결과의 표시값 동일 · 실제 동일 송장 여부 미확정)";
              }
              private String buttonValue(String note){
                  int colon=note.indexOf(": ");
                  if(colon<0||!note.startsWith("배송조회 "))return "";
                  return note.substring(colon+2).replace(" (앞 버튼과 표시 정보 같음 · 동일 송장 여부 미확정)","");
              }
              private String diagnosticCounts(JSONObject d){
                  return "화면정보쌍 "+d.optInt("domPairCount",-1)+
                      " · 구조 운송장 후보 "+d.optInt("structuredInvoices",-1)+
                      " · 구조 택배사쌍 "+d.optInt("structuredPairs",-1)+
                      " · 화면 번호라벨 "+(d.optBoolean("hasLabel")?"있음":"없음")+
                      " · 추출한도 "+(d.optBoolean("limited")?"도달":"정상");
              }
              private void markUnbound(String reason){autoOrderUnbound=true;orderReasons.add(reason);}
              private void markFailed(String reason){autoOrderFailed=true;orderReasons.add(reason);}
              private String pairsText(JSONObject d) throws Exception {
                  JSONArray a=d.getJSONArray("domPairs");java.util.ArrayList<String> out=new java.util.ArrayList<>();
                  for(int i=0;i<a.length();i++){
                      JSONObject p=a.getJSONObject(i);out.add(p.getString("carrier")+" · ****"+p.getString("tail"));
                  }
                  java.util.Collections.sort(out);return android.text.TextUtils.join(" / ",out);
              }
              private void recordCurrentOrder(boolean partial){
                  if(autoIndex>=detailKeys.size())return;
                  String key=detailKeys.get(autoIndex),label=detailLabels.get(key);
                  if(label==null)label="선택한 주문";
                  java.util.Set<String> pairs=linkedResults.get(key);
                  boolean matched=pairs!=null&&!pairs.isEmpty();
                  String state=partial?"중지 · 미완료":targetCancelled?"취소완료 · 배송조회 대상 제외":matched?"배송 확인":autoOrderFailed?"실패":autoOrderUnbound?"추가 확인":"미검출";
                  if(!partial&&matched&&(autoOrderUnbound||autoOrderFailed))state+=" · 추가 확인";
                  if(reusedButtons>0)state+=" · 같은 주문 결과 재사용";
                  boolean kurlyReview=matched&&pairs.contains("컬리넥스트마일 · ****0001");
                  if(kurlyReview)state+=" · 컬리번호 재확인";
                  StringBuilder body=new StringBuilder();
                  if(autoButtonCount<0)body.append("배송조회 버튼 수 미확인 · 직접 검사 완료 0개");
                  else body.append("배송조회 버튼 ").append(autoButtonCount).append("개 · 직접 검사 완료 ").append(autoButtonIndex-reusedButtons).append("개 · 결과 재사용 ").append(reusedButtons).append("개");
                  if(matched)body.append("\n확인된 표시 정보: ").append(android.text.TextUtils.join(" / ",pairs));
                  if(!orderReasons.isEmpty())body.append("\n사유: ").append(android.text.TextUtils.join(" / ",orderReasons));
                  if(kurlyReview)body.append("\n컬리넥스트마일 끝자리 0001이 여러 주문에서 관찰됨 · 고유 운송장 및 상품별 연결 검증 필요");
                  if(!buttonNotes.isEmpty())body.append("\n").append(conciseButtonNotes());
                  if(autoShipping)body.append("\n배송조회 ").append(autoButtonIndex+1).append(": ").append(buttonNote);
                  if(!matched&&!partial&&!targetCancelled&&!autoOrderFailed&&!autoOrderUnbound)body.append("\n운송장 없음으로 확정한 결과가 아님");
                  reportRows.add(new ReportRow(label,state,body.toString(),detailQueue.get(key)));
              }
              private static final int REPORT_PAGE_SIZE=50, COPY_CHAR_LIMIT=180000, EXPORT_REQUEST=7021;
              private int reportPage=0,reportExpected=0;
              private long reportStartedAt=0,reportFinishedAt=0;
              private String pendingExportText=null;
              private String reportTime(long value){
                  return value==0?"미확인":new java.text.SimpleDateFormat("yyyy-MM-dd HH:mm:ss Z",java.util.Locale.ROOT).format(new java.util.Date(value));
              }
              private String buildReportText(){
                  StringBuilder out=new StringBuilder("NPay 조회 테스트 · v0.1.21\n");
                  out.append("검사 시작: ").append(reportTime(reportStartedAt)).append("\n검사 종료: ").append(reportTime(reportFinishedAt));
                  out.append("\n").append(reportSummary);
                  out.append("\n결과 항목 ").append(reportRows.size()).append("건 / 검사 대상 ").append(reportExpected).append("건");
                  out.append("\n검사 미시작 ").append(Math.max(0,reportExpected-reportRows.size())).append("건");
                  out.append("\n현재 조회 가능한 쇼핑 목록의 항목 기준. 동일 주문의 다른 상품이 포함될 수 있음.");
                  out.append("\n상품주문키와 운송장은 끝 4자리만 표시. 같은 표시 정보만으로 동일 송장으로 확정할 수 없음.");
                  out.append("\n상세 주소·로그인 정보는 포함하지 않음. 결과는 앱 종료 시 사라짐.\n");
                  for(ReportRow row:reportRows){
                      out.append("\n[").append(row.label).append("] ").append(row.state).append("\n").append(row.details).append("\n");
                  }
                  return out.toString();
              }
              private void offerReportFile(String text){
                  new android.app.AlertDialog.Builder(this).setTitle("전체 결과 파일로 저장")
                      .setMessage("결과가 커서 클립보드에 담기 어려워. 생략 없이 TXT 파일로 저장할 수 있어.")
                      .setPositiveButton("파일 저장",(d,w)->exportReportText(text)).setNegativeButton("취소",null).show();
              }
              private void copyReport(){
                  String text=buildReportText();
                  if(text.length()>COPY_CHAR_LIMIT){offerReportFile(text);return;}
                  try{
                      android.content.ClipboardManager clipboard=(android.content.ClipboardManager)getSystemService(CLIPBOARD_SERVICE);
                      if(clipboard==null)throw new IllegalStateException();
                      clipboard.setPrimaryClip(android.content.ClipData.newPlainText("NPay 검사 결과",text));
                      Toast.makeText(this,"전체 결과 "+reportRows.size()+"건 복사 완료",Toast.LENGTH_SHORT).show();
                  }catch(RuntimeException ignored){offerReportFile(text);}
              }
              private void exportReportText(String text){
                  Intent intent=new Intent(Intent.ACTION_CREATE_DOCUMENT);
                  intent.addCategory(Intent.CATEGORY_OPENABLE);intent.setType("text/plain");
                  intent.putExtra(Intent.EXTRA_TITLE,"npay-results-"+new java.text.SimpleDateFormat("yyyyMMdd-HHmmss",java.util.Locale.ROOT).format(new java.util.Date())+".txt");
                  pendingExportText=text;
                  try{startActivityForResult(intent,EXPORT_REQUEST);}
                  catch(RuntimeException ignored){pendingExportText=null;Toast.makeText(this,"파일 저장 화면을 열지 못했어. 전체 복사를 이용해줘.",Toast.LENGTH_LONG).show();}
              }
              @Override protected void onActivityResult(int requestCode,int resultCode,Intent data){
                  super.onActivityResult(requestCode,resultCode,data);
                  if(requestCode!=EXPORT_REQUEST)return;
                  final String snapshot=pendingExportText;pendingExportText=null;
                  if(resultCode!=RESULT_OK||data==null||data.getData()==null||snapshot==null)return;
                  final Uri destination=data.getData();
                  new Thread(()->{
                      boolean saved=false;
                      try(java.io.OutputStream stream=getContentResolver().openOutputStream(destination,"wt")){
                          if(stream==null)throw new java.io.IOException();
                          stream.write(snapshot.getBytes(java.nio.charset.StandardCharsets.UTF_8));stream.flush();saved=true;
                      }catch(Exception ignored){saved=false;}
                      final boolean success=saved;
                      handler.post(()->{if(!isFinishing()&&!isDestroyed())Toast.makeText(this,success?"전체 결과 TXT 저장 완료":"TXT 저장 실패. 다시 시도해줘.",Toast.LENGTH_LONG).show();});
                  }).start();
              }
              private void updateScanAwake(){
                  if(autoRunning||sweeping)getWindow().addFlags(android.view.WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                  else getWindow().clearFlags(android.view.WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
              }
              private void showReport(){reportPage=0;showReportPage();}
              private void showReportPage(){
                  if(autoRunning||sweeping||(reportRows.isEmpty()&&reportSummary.isEmpty())){
                      new android.app.AlertDialog.Builder(this).setTitle("검사 안내").setMessage(status.getText()).setPositiveButton("닫기",null).show();return;
                  }
                  int pages=Math.max(1,(reportRows.size()+REPORT_PAGE_SIZE-1)/REPORT_PAGE_SIZE);
                  reportPage=Math.max(0,Math.min(reportPage,pages-1));
                  int from=reportPage*REPORT_PAGE_SIZE,to=Math.min(from+REPORT_PAGE_SIZE,reportRows.size());
                  android.app.AlertDialog dialog=new android.app.AlertDialog.Builder(this).setTitle("항목별 검사 결과 "+(reportPage+1)+"/"+pages)
                      .setPositiveButton("닫기",null).setNegativeButton("전체 복사",null).setNeutralButton("TXT 저장",null).create();
                  android.widget.ScrollView scroll=new android.widget.ScrollView(this);
                  LinearLayout content=new LinearLayout(this);content.setOrientation(LinearLayout.VERTICAL);content.setPadding(dp(16),dp(8),dp(16),dp(8));scroll.addView(content);
                  TextView summary=new TextView(this);summary.setText(reportSummary+"\n화면은 50건씩 표시. 전체 복사·TXT 저장에는 모든 결과가 포함됨. 앱 종료 시 결과는 사라짐.");summary.setTextSize(13);content.addView(summary);
                  if(pages>1){
                      LinearLayout navigation=new LinearLayout(this);
                      Button previous=new Button(this);previous.setText("이전 50건");previous.setEnabled(reportPage>0);
                      previous.setOnClickListener(v->{dialog.dismiss();reportPage--;showReportPage();});
                      Button next=new Button(this);next.setText("다음 50건");next.setEnabled(reportPage+1<pages);
                      next.setOnClickListener(v->{dialog.dismiss();reportPage++;showReportPage();});
                      navigation.addView(previous,new LinearLayout.LayoutParams(0,-2,1));navigation.addView(next,new LinearLayout.LayoutParams(0,-2,1));content.addView(navigation);
                  }
                  for(int i=from;i<to;i++){
                      ReportRow row=reportRows.get(i);
                      TextView text=new TextView(this);text.setText(row.label+" · "+row.state+"\n"+row.details);text.setTextSize(14);
                      text.setTextColor(Color.BLACK);text.setPadding(0,dp(16),0,dp(4));content.addView(text);
                      if(row.address!=null&&safeAutoUrl(row.address)){
                          Button open=new Button(this);open.setText(row.label.split(" · ")[0]+" 주문상세 대조");
                          open.setOnClickListener(v->{
                              dialog.dismiss();closeDiagnostics();
                              if(browser!=null){status.setText(row.label+" · 직접 대조 중. 결과 칸을 누르면 검사 목록을 다시 볼 수 있어.");browser.loadUrl(row.address);}
                          });content.addView(open);
                      }
                  }
                  dialog.setView(scroll);dialog.show();
                  dialog.getButton(android.app.AlertDialog.BUTTON_NEGATIVE).setOnClickListener(v->copyReport());
                  dialog.getButton(android.app.AlertDialog.BUTTON_NEUTRAL).setOnClickListener(v->exportReportText(buildReportText()));
              }


              private Button autoButton;
              private boolean collectDetails=false, autoRunning=false, autoReading=false, resumeAvailable=false;
              private int autoRun=0, autoStep=0, autoIndex=0, autoDone=0, autoMatched=0, autoMissing=0, autoFailed=0, autoUnbound=0, autoNoLink=0, autoListCount=0;
