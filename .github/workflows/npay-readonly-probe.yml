name: NPay Readonly Probe APK

on:
  push:
    branches:
      - test/npay-readonly-probe
    paths:
      - .github/workflows/npay-readonly-probe.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'
      - name: Set up isolated debug APK project
        shell: bash
        run: |
          set -euo pipefail
          cp -r android/restock-worker android/npay-probe-ci
          rm -rf android/npay-probe-ci/app/src/main/java
          rm -rf android/npay-probe-ci/app/src/test
          mkdir -p android/npay-probe-ci/app/src/main/java/com/techhun/keyboardalert/restock
          sed -i 's/applicationId = "com.techhun.keyboardalert.restock"/applicationId = "com.techhun.npayprobe"/' android/npay-probe-ci/app/build.gradle.kts
          sed -i 's/versionName = "0.14.10"/versionName = "0.1.6-probe"/' android/npay-probe-ci/app/build.gradle.kts
          cat > android/npay-probe-ci/app/src/main/AndroidManifest.xml <<'MANIFEST'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <application android:label="NPay 조회 테스트" android:usesCleartextTraffic="false" android:allowBackup="false">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN" />
                  <category android:name="android.intent.category.LAUNCHER" />
                </intent-filter>
              </activity>
            </application>
          </manifest>
          MANIFEST
          cat > android/npay-probe-ci/app/src/main/java/com/techhun/keyboardalert/restock/MainActivity.java <<'JAVA'
          package com.techhun.keyboardalert.restock;

          import android.annotation.SuppressLint;
          import android.app.Activity;
          import android.content.Intent;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.widget.Toast;
          import android.view.View;
          import android.webkit.CookieManager;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import org.json.JSONArray;
          import org.json.JSONObject;

          public class MainActivity extends Activity {
              private static final String URL = "https://pay.naver.com/pc/history?page=1&serviceChannel=SHOPPING";
              private WebView browser;
              private TextView status, result, pageStatus;
              private int openTaps=0, inspectTaps=0, testTaps=0, detailTaps=0;
              private final Handler handler=new Handler(Looper.getMainLooper());
              private int inspectSeq=0;
              private int tapCount=0;
              private TextView tapStatus;
              private boolean inspecting=false;
              private final String js = "(function(){try{if(location.protocol!=='https:'||location.hostname!=='pay.naver.com')return JSON.stringify({ok:false,reason:'NOT_PAY_ORIGIN'});"+
                  "var el=document.getElementById('__NEXT_DATA__');if(!el)return JSON.stringify({ok:false,reason:'NO_NEXT_DATA'});"+
                  "var d=JSON.parse(el.textContent),q=d&&d.props&&d.props.pageProps&&d.props.pageProps.dehydratedState&&d.props.pageProps.dehydratedState.queries;"+
                  "if(!Array.isArray(q))return JSON.stringify({ok:false,reason:'NO_QUERIES'});"+
                  "var e=null;for(var i=0;i<q.length;i++){if(Array.isArray(q[i].queryKey)&&q[i].queryKey[0]==='PAYMENT_LIST'){e=q[i];break;}}"+
                  "if(!e)return JSON.stringify({ok:false,reason:'NO_PAYMENT_LIST'});"+
                  "var p=(e.state&&e.state.data&&e.state.data.pages)||[],a=[];for(var j=0;j<p.length;j++){if(Array.isArray(p[j].items))a=a.concat(p[j].items);}"+
                  "return JSON.stringify({ok:true,items:a.length,hasOrderNo:a.filter(x=>!!(x&&x.additionalData&&x.additionalData.productOrderNo)).length,"+
                  "hasDetail:a.filter(x=>!!(x&&x.orderDetailUrl)).length,bundles:a.filter(x=>Number(x&&x.bundlePaymentCount)>1).length,"+
                  "pages:Number((p[0]&&p[0].totalPage)||0)});}catch(_){return JSON.stringify({ok:false,reason:'PARSE_ERROR'});}})()";

              private final String detailJs = "(function(){try{if(location.protocol!=='https:'||!(location.hostname==='pay.naver.com'||location.hostname.endsWith('.pay.naver.com')))return JSON.stringify({ok:false,reason:'NOT_PAY_ORIGIN'});var invoiceKeys=['invoiceNo','invoiceNumber','trackingNo','trackingNumber','waybillNo','waybillNumber'];var carrierKeys=['deliveryCompanyName','deliveryCompany','courierName','carrierName','shippingCompanyName'];var seen=[],pairs=0,invoices=0,carriers=0,nodes=0,limited=false;function invoice(v){if(typeof v!=='string')return false;var n=v.replace(/[ -]/g,'');return /^[0-9]{8,20}$/.test(n);}function carrier(v){return typeof v==='string'&&/^(CJ대한통운|CJ 대한통운|대한통운|한진택배|한진|롯데택배|롯데|로젠택배|로젠|우체국택배|우체국|경동택배|경동|대신택배|대신|CU편의점택배|GSPostbox|GS postbox)$/.test(v.trim());}function walk(o,depth){if(!o||typeof o!=='object')return;if(depth>25||++nodes>30000){limited=true;return;}var inv='',car='';for(var i=0;i<invoiceKeys.length;i++){var v=o[invoiceKeys[i]];if(invoice(v)){inv=v.replace(/[ -]/g,'');break;}}for(var j=0;j<carrierKeys.length;j++){var w=o[carrierKeys[j]];if(carrier(w)){car=w.trim();break;}}if(inv&&seen.indexOf(inv)<0){seen.push(inv);invoices++;if(car)pairs++;}if(car)carriers++;Object.keys(o).forEach(function(k){walk(o[k],depth+1);});}var el=document.getElementById('__NEXT_DATA__'),hasData=!!el;if(el){if(el.textContent.length>5000000)return JSON.stringify({ok:false,reason:'DATA_TOO_LARGE'});walk(JSON.parse(el.textContent),0);}var body=document.body?document.body.innerText:'';if(body.length>500000){body=body.slice(0,500000);limited=true;}var label=/운송장\\s*번호|송장\\s*번호/.test(body);var matches=body.match(/(?:운송장\\s*번호|송장\\s*번호)\\s*[:：]?\\s*([0-9][0-9 -]{6,28}[0-9])/g)||[];var dom=0;matches.forEach(function(m){var v=m.replace(/^(?:운송장\\s*번호|송장\\s*번호)\\s*[:：]?\\s*/,'');if(invoice(v))dom++;});var domPairs=[],pairKeys=[],elements=document.querySelectorAll('div,section,li,p,span,dl');var pairPattern=/^(CJ대한통운|CJ 대한통운|대한통운|한진택배|한진|롯데택배|롯데|로젠택배|로젠|우체국택배|우체국|경동택배|경동|대신택배|대신|CU편의점택배|GSPostbox|GS postbox)\\s*(?:(?:운송장\\s*번호|송장\\s*번호)\\s*[:：]?\\s*)?([0-9][0-9 -]{6,28}[0-9])\\s*(?:복사하기|복사)?$/;for(var ei=0;ei<elements.length&&ei<12000;ei++){var node=elements[ei];if(!node.getClientRects().length)continue;var t=(node.innerText||'').trim();if(!t||t.length>100)continue;var pm=t.match(pairPattern);if(!pm||!invoice(pm[2]))continue;var number=pm[2].replace(/[ -]/g,''),key=pm[1]+'|'+number;if(pairKeys.indexOf(key)>=0)continue;pairKeys.push(key);if(domPairs.length<10)domPairs.push({carrier:pm[1],tail:number.slice(-4)});}if(elements.length>12000||pairKeys.length>10)limited=true;return JSON.stringify({ok:true,domPairs:domPairs,domPairCount:pairKeys.length,hasData:hasData,structuredInvoices:invoices,structuredCarriers:carriers,structuredPairs:pairs,domInvoices:dom,hasLabel:label,limited:limited});}catch(_){return JSON.stringify({ok:false,reason:'DETAIL_PARSE_ERROR'});}})()";
              @Override @SuppressLint("SetJavaScriptEnabled")
              protected void onCreate(Bundle state) {
                  super.onCreate(state);
                  WebView.setWebContentsDebuggingEnabled(false);
                  LinearLayout root=new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setBackgroundColor(Color.WHITE);
                  root.setPadding(16,32,16,12);
                  root.setFitsSystemWindows(true);
                  TextView title=new TextView(this);
                  title.setText("네이버페이 연동 검증 v0.1.6");
                  title.setTextColor(Color.BLACK);
                  title.setTextSize(20);
                  root.addView(title);
                  status=new TextView(this);
                  status.setTextColor(Color.rgb(25,31,40));
                  status.setTextSize(14f);
                  status.setBackgroundColor(Color.rgb(239,243,248));
                  status.setPadding(16,16,16,16);
                  status.setText("네이버페이 로그인 후 아래 목록 검사 버튼을 눌러줘.\n계정/주문 정보는 저장하거나 전송하지 않아.");
                  root.addView(status);
                  result=new TextView(this);
                  result.setTextColor(Color.BLACK);
                  result.setTextSize(18f);
                  result.setPadding(16,12,16,12);
                  result.setBackgroundColor(Color.rgb(230,245,235));
                  result.setText("주문 건수: 검사 전");
                  root.addView(result);
                  pageStatus=new TextView(this);
                  pageStatus.setTextColor(Color.DKGRAY);
                  pageStatus.setTextSize(13f);
                  pageStatus.setText("페이지: 준비 중");
                  root.addView(pageStatus);
                  tapStatus=new TextView(this);
                  tapStatus.setTextColor(Color.rgb(120,10,30));
                  tapStatus.setTextSize(16f);
                  tapStatus.setBackgroundColor(Color.rgb(255,236,240));
                  tapStatus.setText("터치 진단: 아직 누른 버튼 없음");
                  tapStatus.setPadding(16,14,16,14);
                  root.addView(tapStatus);
                  LinearLayout buttons=new LinearLayout(this);
                  Button reload=new Button(this);
                  reload.setText("결제내역 열기");
                  reload.setOnClickListener(v->{
                      noteTouch("결제내역 열기");
                      if(browser!=null)browser.loadUrl(URL);
                  });
                  buttons.addView(reload,new LinearLayout.LayoutParams(0,-2,1));
                  Button inspect=new Button(this);
                  inspect.setText("현재 목록 검사");
                  inspect.setOnClickListener(v->{
                      noteTouch("현재 목록 검사");
                      inspect();
                  });
                  buttons.addView(inspect,new LinearLayout.LayoutParams(0,150,1));
                  root.addView(buttons);
                  Button nativeTest=new Button(this);
                  nativeTest.setText("버튼 동작 확인 (로그인 무관)");
                  nativeTest.setOnClickListener(v->noteTouch("버튼 동작 확인"));
                  root.addView(nativeTest);
                  Button detail=new Button(this);
                  detail.setText("현재 상세·배송 화면 검사");
                  detail.setOnClickListener(v->{noteTouch("상세 검사");inspectDetail();});
                  root.addView(detail);
                  browser=new WebView(this);
                  WebSettings s=browser.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setMixedContentMode(WebSettings.MIXED_CONTENT_NEVER_ALLOW);
                  s.setAllowFileAccess(false);
                  s.setAllowContentAccess(false);
                  s.setAllowFileAccessFromFileURLs(false);
                  s.setAllowUniversalAccessFromFileURLs(false);
                  s.setJavaScriptCanOpenWindowsAutomatically(false);
                  String agent=s.getUserAgentString();
                  s.setUserAgentString(agent.replace("; wv)", ")").replace("Version/4.0 ", ""));
                  CookieManager cm=CookieManager.getInstance();
                  cm.setAcceptCookie(true);
                  cm.setAcceptThirdPartyCookies(browser,true);
                  browser.setWebChromeClient(new WebChromeClient());
                  browser.setWebViewClient(new WebViewClient(){
                      @Override public boolean shouldOverrideUrlLoading(WebView view,WebResourceRequest request){
                          return navigate(request.getUrl().toString());
                      }
                      @Override public boolean shouldOverrideUrlLoading(WebView view,String url){
                          return navigate(url);
                      }
                      @Override public void onPageStarted(WebView view,String url,android.graphics.Bitmap icon){
                          pageStatus.setText("페이지: 로딩 중 · "+safePage(url));
                          if(inspecting){
                              result.setText("주문 건수: 확인 실패");
                              finish(inspectSeq,"E_NAVIGATION · 검사 중 페이지 이동. 로딩 후 재검사");
                          }
                      }
                      @Override public void onReceivedError(WebView view,WebResourceRequest request,android.webkit.WebResourceError error){
                          if(request.isForMainFrame()){
                              pageStatus.setText("페이지: 로딩 실패 · 코드 "+error.getErrorCode());
                              if(inspecting){result.setText("주문 건수: 확인 실패");finish(inspectSeq,"E_PAGE · 페이지 로딩 실패");}
                          }
                      }
                      @Override public boolean onRenderProcessGone(WebView view,android.webkit.RenderProcessGoneDetail detail){
                          pageStatus.setText("E_RENDERER · 화면 엔진 종료. 앱을 다시 실행해줘.");
                          if(inspecting){result.setText("주문 건수: 확인 실패");finish(inspectSeq,"E_RENDERER · 검사 중단");}
                          view.destroy();browser=null;return true;
                      }
                      @Override public void onPageFinished(WebView view,String url){
                          pageStatus.setText("페이지: 로딩 완료 · "+safePage(url));
                          CookieManager.getInstance().flush();
                      }
                  });
                  root.addView(browser,new LinearLayout.LayoutParams(-1,0,1));
                  setContentView(root);
                  browser.loadUrl(URL);
              }
              private void noteTouch(String label){
                  ++tapCount;
                  if("결제내역 열기".equals(label))openTaps++;
                  else if("현재 목록 검사".equals(label))inspectTaps++;
                  else if("상세 검사".equals(label))detailTaps++;
                  else testTaps++;
                  tapStatus.setText("열기 "+openTaps+" / 검사 "+inspectTaps+" / 상세 "+detailTaps+" / 진단 "+testTaps+"회");
                  Toast.makeText(this,"버튼 입력 인식: "+tapCount+"회",Toast.LENGTH_SHORT).show();
              }
              private boolean navigate(String address){
                  try {
                      Uri uri=Uri.parse(address);
                      String scheme=uri.getScheme();
                      if("https".equalsIgnoreCase(scheme)){
                          String host=uri.getHost();
                          return host==null||!(host.equals("naver.com")||host.endsWith(".naver.com"));
                      }
                      if("nidlogin".equalsIgnoreCase(scheme)){
                          Intent intent=new Intent(Intent.ACTION_VIEW,uri);
                          intent.setPackage("com.nhn.android.search");
                          try{startActivity(intent);}catch(Exception e){pageStatus.setText("페이지: 네이버 웹 화면에서 로그인해줘.");}
                      }
                  } catch(Exception ignored){}
                  return true;
              }
              private String safeHost(String address){
                  try {String host=Uri.parse(address).getHost();return host==null?"호스트 없음":host;}
                  catch(Exception e){return "호스트 확인 불가";}
              }
              private String safePage(String address){
                  String host=safeHost(address);
                  if(!"pay.naver.com".equals(host))return host+" · 경로 숨김";
                  try{
                      String path=Uri.parse(address).getPath();
                      String[] known={"/pc/history","/history","/m/history","/historybenefit/paymenthistory"};
                      for(String route:known){
                          if(route.equals(path)||(route+"/").equals(path))return host+route;
                      }
                      return host+" · 기타 경로(숨김)";
                  }catch(Exception e){return host+" · 경로 확인 불가";}
              }
              private void finish(int seq,String message){
                  if(seq!=inspectSeq||!inspecting)return;
                  inspecting=false;
                  status.setText(message);
              }
              private void inspect(){
                  final int seq=++inspectSeq;
                  inspecting=true;
                  result.setText("주문 건수: 검사 중");
                  status.setText("검사 #"+seq+" · S1 URL 확인");
                  handler.postDelayed(()->{
                      if(seq==inspectSeq&&inspecting){
                          result.setText("주문 건수: 확인 실패");
                          finish(seq,"E_TIMEOUT · 9초 동안 응답 없음. 다시 검사해줘.");
                      }
                  },9000);
                  try{
                      if(browser==null)throw new IllegalStateException();
                      Uri current=Uri.parse(browser.getUrl()==null?"":browser.getUrl());
                      pageStatus.setText("페이지: "+safePage(browser.getUrl()==null?"":browser.getUrl()));
                      if(!"https".equals(current.getScheme())||!"pay.naver.com".equals(current.getHost())){
                          result.setText("주문 건수: 확인 실패");
                          finish(seq,"E_URL · 네이버페이 호스트가 아니야. 결제내역 열기 후 다시 검사해줘.");
                          return;
                      }
                      status.setText("검사 #"+seq+" · S2 JavaScript 응답 대기");
                      browser.evaluateJavascript(js,ret->{
                          if(seq!=inspectSeq||!inspecting)return;
                          status.setText("검사 #"+seq+" · S3 응답 수신 / JSON 해석");
                          try{
                              if(ret==null||"null".equals(ret)||ret.length()>8192){
                                  result.setText("주문 건수: 확인 실패");
                                  finish(seq,"E_JS_RETURN · 유효한 응답 없음");return;
                              }
                              Object value=new JSONArray("["+ret+"]").get(0);
                              if(!(value instanceof String))throw new IllegalArgumentException();
                              JSONObject d=new JSONObject((String)value);
                              if(!d.optBoolean("ok")){
                                  String reason=d.optString("reason","");
                                  if(!reason.matches("NOT_PAY_ORIGIN|NO_NEXT_DATA|NO_QUERIES|NO_PAYMENT_LIST|PARSE_ERROR"))
                                      reason="UNKNOWN";
                                  result.setText("주문 건수: 확인 실패");
                                  finish(seq,"E_DATA · "+reason+" · 결제내역 화면에서 로딩 후 재검사");
                              }else{
                                  result.setText("현재 불러온 목록: "+d.getInt("items")+"건");
                                  finish(seq,"완료 #"+seq+" · 상품주문번호 "+d.getInt("hasOrderNo")+
                                      " / 상세링크 "+d.getInt("hasDetail")+" / 묶음 "+d.getInt("bundles")+
                                      "건 · 전체 "+d.getInt("pages")+"페이지");
                              }
                          }catch(Exception e){
                              result.setText("주문 건수: 확인 실패");
                              finish(seq,"E_JSON · 응답 해석 실패");
                          }
                      });
                  }catch(Exception e){
                      result.setText("주문 건수: 확인 실패");
                      finish(seq,"E_EXEC · WebView 검사 실행 실패");
                  }
              }
              private void inspectDetail(){
                  final int seq=++inspectSeq;
                  inspecting=true;
                  result.setText("배송 정보 후보: 검사 중");
                  status.setText("상세 검사 #"+seq+" · 주문 상세 또는 배송조회 화면을 직접 연 뒤 사용");
                  handler.postDelayed(()->{
                      if(seq==inspectSeq&&inspecting){
                          result.setText("배송 정보 후보: 확인 실패");
                          finish(seq,"E_DETAIL_TIMEOUT · 응답 없음. 로딩 후 재검사");
                      }
                  },9000);
                  try{
                      if(browser==null)throw new IllegalStateException();
                      Uri uri=Uri.parse(browser.getUrl()==null?"":browser.getUrl());
                      String host=uri.getHost();
                      pageStatus.setText("상세 페이지 호스트: "+safeHost(browser.getUrl()==null?"":browser.getUrl()));
                      if(!"https".equals(uri.getScheme())||host==null||
                          !("pay.naver.com".equals(host)||host.endsWith(".pay.naver.com"))){
                          result.setText("배송 정보 후보: 확인 실패");
                          finish(seq,"E_DETAIL_ORIGIN · 네이버페이 상세·배송 화면에서 검사해줘.");return;
                      }
                      browser.evaluateJavascript(detailJs,ret->{
                          if(seq!=inspectSeq||!inspecting)return;
                          try{
                              if(ret==null||ret.length()>8192)throw new IllegalArgumentException();
                              Object value=new JSONArray("["+ret+"]").get(0);
                              if(!(value instanceof String))throw new IllegalArgumentException();
                              JSONObject d=new JSONObject((String)value);
                              if(!d.optBoolean("ok")){
                                  String reason=d.optString("reason","");
                                  if(!reason.matches("NOT_PAY_ORIGIN|DATA_TOO_LARGE|DETAIL_PARSE_ERROR"))reason="UNKNOWN";
                                  result.setText("배송 정보 후보: 확인 실패");
                                  finish(seq,"E_DETAIL_DATA · "+reason);return;
                              }
                              JSONArray pairs=d.getJSONArray("domPairs");
                              StringBuilder matched=new StringBuilder();
                              String allowed="CJ대한통운|CJ 대한통운|대한통운|한진택배|한진|롯데택배|롯데|로젠택배|로젠|우체국택배|우체국|경동택배|경동|대신택배|대신|CU편의점택배|GSPostbox|GS postbox";
                              for(int i=0;i<pairs.length()&&i<10;i++){
                                  JSONObject pair=pairs.getJSONObject(i);
                                  String company=pair.getString("carrier"),tail=pair.getString("tail");
                                  if(!company.matches(allowed)||!tail.matches("[0-9]{4}"))throw new IllegalArgumentException();
                                  if(matched.length()>0)matched.append(" / ");
                                  matched.append(company).append(" · ****").append(tail);
                              }
                              result.setText(d.getInt("domPairCount")>0?
                                  "화면 배송정보 "+d.getInt("domPairCount")+"쌍 · "+matched:
                                  "화면 배송정보 쌍: 미검출");
                              finish(seq,"구조 내 운송장 후보 "+d.getInt("structuredInvoices")+
                                  "건 · 택배사 동시 후보 "+d.getInt("structuredPairs")+"건 · 화면 번호 후보 "+d.getInt("domInvoices")+
                                  "건 / 번호 라벨 "+(d.getBoolean("hasLabel")?"있음":"없음")+
                                  " / 초기 데이터 "+(d.getBoolean("hasData")?"있음":"없음")+
                                  (d.getBoolean("limited")?" · 검사 한도 도달":"")+
                                  "\n택배사·끝 4자리를 실제 화면과 대조해줘. 미검출도 운송장 없음으로 단정할 수 없어.");
                          }catch(Exception e){
                              result.setText("배송 정보 후보: 확인 실패");
                              finish(seq,"E_DETAIL_JSON · 응답 해석 실패");
                          }
                      });
                  }catch(Exception e){
                      result.setText("배송 정보 후보: 확인 실패");
                      finish(seq,"E_DETAIL_EXEC · 검사 실행 실패");
                  }
              }
              @Override public void onBackPressed(){
                  if(browser!=null&&browser.canGoBack())browser.goBack();else super.onBackPressed();
              }
              @Override protected void onDestroy(){
                  handler.removeCallbacksAndMessages(null);
                  if(browser!=null){browser.stopLoading();browser.destroy();browser=null;}
                  super.onDestroy();
              }
          }
