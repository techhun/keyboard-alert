              private int detailRetries=0,changedRetries=0,reusedButtons=0,totalReusedButtons=0;
              private String candidateSignature="",currentCacheKey="";
              private boolean targetPresent=false;
              private static class OrderCache {
                  final java.util.LinkedHashSet<String> pairs;
                  final java.util.ArrayList<String> notes;
                  final String source;
                  OrderCache(java.util.Set<String> p,java.util.List<String> n,String s){pairs=new java.util.LinkedHashSet<>(p);notes=new java.util.ArrayList<>(n);source=s;}
              }
              private final java.util.HashMap<String,OrderCache> orderCache=new java.util.HashMap<>();
              private boolean canCache(){return targetPresent&&!targetCancelled&&!autoOrderFailed&&!autoOrderUnbound&&autoButtonCount>0&&autoButtonIndex==autoButtonCount&&reusedButtons==0&&!currentCacheKey.isEmpty()&&buttonNotes.size()==autoButtonCount;}
              private int autoButtonIndex=0,autoButtonCount=-1,autoButtonsDone=0,autoButtonsTotal=0;
