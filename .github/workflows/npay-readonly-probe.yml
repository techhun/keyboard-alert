                              JSONObject d=new JSONObject((String)value);
                              if(!d.optBoolean("ok")){
                                  String reason=d.optString("reason","");
                                  if(!reason.matches("NOT_PAY_ORIGIN|DATA_TOO_LARGE|DETAIL_PARSE_ERROR"))reason="UNKNOWN";
                                  result.setText("배송 정보 후보: 확인 실패");
