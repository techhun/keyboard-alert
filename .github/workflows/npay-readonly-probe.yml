                  Uri uri=Uri.parse(browser.getUrl()==null?"":browser.getUrl());
                  String path=uri.getPath();
                  if(!"https".equals(uri.getScheme())||!"pay.naver.com".equals(uri.getHost())||
                      !("/history".equals(path)||"/history/".equals(path)||"/pc/history".equals(path)||"/pc/history/".equals(path))){
                      status.setText("결제내역 목록에서 로그인한 뒤 전체 목록 검사를 눌러줘.");return;
                  }
                  resumeAvailable=false;detailQueue.clear();linkedResults.clear();detailLabels.clear();detailIds.clear();reportRows.clear();reportSummary="";reportPage=0;reportExpected=0;reportStartedAt=System.currentTimeMillis();reportFinishedAt=0;
                  if(collectDetails)autoButton.setText("목록 검사 중지");
                  inspectSeq++;inspecting=false;
                  sweeping=true;updateScanAwake();sweepRun++;sweepPage=1;sweepTotal=-1;sweepDuplicates=0;sweepReadPages=0;sweepKeys.clear();
                  sweepButton.setText("전체 검사 중지");
                  loadSweepPage(sweepRun);
              }
              private void stopSweep(String reason){
                  if(!sweeping)return;
                  sweeping=false;updateScanAwake();sweepReading=false;sweepRun++;
                  sweepButton.setText("전체 목록 다시 검사");
                  result.setText("목록 항목 "+sweepKeys.size()+"건 · 확인한 페이지 "+sweepReadPages+
                      (sweepTotal>=0?"/"+sweepTotal:""));
                  status.setText(reason+" · 중복 "+sweepDuplicates+"건 제외"+
                      "\n묶음 내 개별 상품·배송정보 수집은 미포함. 재시작하면 처음부터 검사.");
                  reportFinishedAt=System.currentTimeMillis();reportSummary=result.getText()+"\n"+status.getText()+"\n배송 검사 시작 전 목록 수집 결과";
                  sweepKeys.clear();
                  if(collectDetails){collectDetails=false;detailQueue.clear();detailLabels.clear();detailIds.clear();autoButton.setText("전체 배송 검사");}
              }
              private void loadSweepPage(int run){
                  if(!sweeping||run!=sweepRun||browser==null)return;
                  final int page=sweepPage;
                  sweepReading=false;
                  status.setText("전체 목록 검사 · "+page+(sweepTotal>=0?"/"+sweepTotal:"")+"페이지 로딩 중");
                  result.setText("중복 제외 목록 항목 "+sweepKeys.size()+"건 · 진행 중");
                  handler.postDelayed(()->{
                      if(sweeping&&run==sweepRun&&page==sweepPage)stopSweep("E_SWEEP_TIMEOUT · 페이지 응답 없음 · 부분 결과");
                  },30000);
                  try{
                      String next=Uri.parse(URL).buildUpon().clearQuery().appendQueryParameter("page",String.valueOf(page))
                          .appendQueryParameter("serviceChannel","SHOPPING").build().toString();
                      browser.loadUrl(next);
                  }catch(Exception e){stopSweep("E_SWEEP_LOAD · 페이지 열기 실패 · 부분 결과");}
              }
              private void pollSweep(int run,int page,int attempt){
                  handler.postDelayed(()->{
                      if(!sweeping||run!=sweepRun||page!=sweepPage||browser==null)return;
                      try{
                          browser.evaluateJavascript(sweepJs.replace("__PAGE__",String.valueOf(page)),ret->{
                              if(!sweeping||run!=sweepRun||page!=sweepPage)return;
                              try{
                                  if(ret==null||ret.length()>200000)throw new IllegalArgumentException();
                                  Object value=new JSONArray("["+ret+"]").get(0);
                                  if(!(value instanceof String))throw new IllegalArgumentException();
                                  JSONObject d=new JSONObject((String)value);
                                  if(!d.optBoolean("ok")){
                                      String reason=d.optString("reason","");
                                      if(("WAIT_DATA".equals(reason)||"PAGE_MISMATCH".equals(reason))&&attempt<19){
                                          status.setText("전체 목록 검사 · "+page+"페이지 데이터 대기 "+(attempt+1)+"/20");
                                          pollSweep(run,page,attempt+1);return;
                                      }
                                      if(!reason.matches("NOT_HISTORY|WAIT_DATA|PAGE_MISMATCH|BAD_PAGES|BAD_PAGE|PAGE_TOO_LARGE|MISSING_ORDER_KEY|SWEEP_PARSE_ERROR"))reason="UNKNOWN";
                                      stopSweep("E_SWEEP_"+reason+" · 부분 결과");return;
                                  }
                                  int actual=d.getInt("page"),total=d.getInt("total");
                                  if(actual!=page||total<0||total>500)throw new IllegalArgumentException();
                                  if(sweepTotal>=0&&sweepTotal!=total){stopSweep("E_SWEEP_TOTAL_CHANGED · 전체 페이지 변경 · 부분 결과");return;}
                                  sweepTotal=total;
                                  JSONArray ids=d.getJSONArray("ids");
                                  JSONArray links=d.getJSONArray("links");
                                  if(ids.length()!=links.length())throw new IllegalArgumentException();
                                  java.util.HashSet<String> batch=new java.util.HashSet<>();
                                  java.security.MessageDigest digest=java.security.MessageDigest.getInstance("SHA-256");
                                  for(int i=0;i<ids.length();i++){
                                      String id=ids.getString(i);
                                      if(!id.matches("[A-Za-z0-9_-]{1,80}"))throw new IllegalArgumentException();
                                      String hash=android.util.Base64.encodeToString(digest.digest(id.getBytes(java.nio.charset.StandardCharsets.UTF_8)),android.util.Base64.NO_WRAP);
                                      if(!batch.add(hash))sweepDuplicates++;
                                      if(collectDetails&&!detailQueue.containsKey(hash)){
                                          String link=links.getString(i);
                                          detailQueue.put(hash,safeAutoUrl(link)?link:"");
                                          detailIds.put(hash,id);
                                          detailLabels.put(hash,"목록 "+detailQueue.size()+(id.length()>4?" · 상품주문키 ****"+id.substring(id.length()-4):""));
                                      }
                                  }
                                  if(batch.isEmpty()&&!(page==1&&total==0)){stopSweep("E_SWEEP_EMPTY · 예상 밖 빈 페이지 · 부분 결과");return;}
                                  int added=0;for(String key:batch){if(sweepKeys.add(key))added++;else sweepDuplicates++;}
                                  if(added==0&&!batch.isEmpty()){stopSweep("E_SWEEP_REPEATED · 같은 목록 반복 · 부분 결과");return;}
                                  sweepReadPages++;
                                  if(sweepKeys.size()>100000){stopSweep("E_SWEEP_LIMIT · 검사 한도 · 부분 결과");return;}
                                  if(page>=total){
                                      if(collectDetails){
                                          autoListCount=detailQueue.size();collectDetails=false;
                                          stopSweep("전체 목록 수집 완료 · 배송 검사 준비");startAuto();
                                      }else stopSweep("페이지 검사 완료 · 현재 조회조건 기준");
                                      return;
                                  }
                                  sweepPage++;
                                  loadSweepPage(run);
                              }catch(Exception e){stopSweep("E_SWEEP_JSON · 응답 검증 실패 · 부분 결과");}
                          });
                      }catch(Exception e){stopSweep("E_SWEEP_EXEC · 검사 실행 실패 · 부분 결과");}
                  },1200);
              }
              private boolean safeAutoUrl(String address){
                  try{
                      if(address.length()>4096)return false;
                      Uri u=Uri.parse(address);String host=u.getHost();
                      return "https".equals(u.getScheme())&&u.getUserInfo()==null&&host!=null&&
                          ("pay.naver.com".equals(host)||host.endsWith(".pay.naver.com"));
                  }catch(Exception e){return false;}
              }
              private boolean sameAutoPage(String current){
                  try{return Uri.parse(current).buildUpon().fragment(null).build().toString().equals(
                      Uri.parse(autoExpected).buildUpon().fragment(null).build().toString());}
                  catch(Exception e){return false;}
              }
              private void startCurrentOrder(){
                  if(autoRunning){stopAuto("사용자 중지 · 부분 결과");return;}
                  if(sweeping){stopSweep("사용자 중지 · 부분 결과");return;}
                  String address=browser==null?"":browser.getUrl();
                  if(address==null||!safeAutoUrl(address)||!"orders.pay.naver.com".equals(Uri.parse(address).getHost())){
                      status.setText("검사할 주문상세를 직접 연 뒤 눌러줘.");return;
                  }
                  ++entrySeq;++inspectSeq;inspecting=false;collectDetails=false;
                  detailQueue.clear();linkedResults.clear();detailLabels.clear();detailIds.clear();detailQueue.put("current",address);detailLabels.put("current","선택한 주문");
                  reportStartedAt=System.currentTimeMillis();autoListCount=1;closeDiagnostics();startAuto();
              }
              private void startAuto(){
                  resumeAvailable=false;reportRows.clear();reportSummary="";
                  detailKeys.clear();detailKeys.addAll(detailQueue.keySet());reportExpected=detailKeys.size();reportPage=0;reportFinishedAt=0;
                  autoRunning=true;updateScanAwake();autoRun++;autoIndex=0;autoDone=0;autoMatched=0;autoMissing=0;
                  autoFailed=0;autoUnbound=0;autoNoLink=0;autoButtonsDone=0;autoButtonsTotal=0;autoCancelled=0;totalReusedButtons=0;orderCache.clear();
                  autoButton.setText("자동 검사 중지");closeDiagnostics();nextAutoOrder(autoRun);
              }
              private void resumeAuto(){
                  if(!resumeAvailable||autoRunning||sweeping||browser==null||autoIndex>=detailKeys.size())return;
                  // The last row records the interrupted item; it will be rechecked.
                  if(reportRows.size()!=autoDone+1||!reportRows.get(reportRows.size()-1).state.startsWith("중지 ·")){
                      status.setText("이전 검사 상태가 달라 이어할 수 없어. 전체 검사를 다시 시작해줘.");return;
                  }
                  String address=detailQueue.get(detailKeys.get(autoIndex));
                  if(address==null||(!address.isEmpty()&&!safeAutoUrl(address))){
                      status.setText("남은 주문상세 주소가 유효하지 않아 이어할 수 없어.");return;
                  }
                  reportRows.remove(reportRows.size()-1);
                  // The interrupted item is fully retried; roll back its partial counters.
                  if(autoButtonCount>=0)autoButtonsTotal=Math.max(0,autoButtonsTotal-autoButtonCount);
                  autoButtonsDone=Math.max(0,autoButtonsDone-autoButtonIndex);
                  reportSummary="";reportFinishedAt=0;resumeAvailable=false;
                  inspectSeq++;inspecting=false;autoRunning=true;updateScanAwake();autoRun++;
                  autoButton.setText("자동 검사 중지");closeDiagnostics();nextAutoOrder(autoRun);
              }
              private void stopAuto(String reason){
                  if(!autoRunning)return;
                  boolean paused="사용자 중지 · 부분 결과".equals(reason)&&detailKeys.size()>1&&autoIndex<detailKeys.size()&&autoDone==autoIndex;
                  if(autoIndex<detailKeys.size()){
                      orderReasons.add(reason);recordCurrentOrder(true);
                  }
                  autoRunning=false;updateScanAwake();autoRun++;autoStep++;autoReading=false;autoShipping=false;
                  resumeAvailable=paused;autoButton.setText(paused?"남은 검사 이어하기":"전체 배송 검사");sweepButton.setText("전체 목록 검사");
                  String oneOrder="";
                  if(detailKeys.size()==1){
                      java.util.Set<String> pairs=linkedResults.get(detailKeys.get(0));
                      if(pairs!=null&&!pairs.isEmpty())oneOrder=android.text.TextUtils.join(" / ",pairs);
                  }
                  result.setText("처리 "+autoDone+"/"+detailKeys.size()+" · 배송 확인 "+autoMatched+"건"+
                      (oneOrder.isEmpty()?"":"\n"+oneOrder));
                  status.setText(reason+" · 취소 제외 "+autoCancelled+" / 미검출 "+autoMissing+" / 실패 "+autoFailed+" / 링크 없음 "+autoNoLink+
                      " / 추가 확인 "+autoUnbound+"\n배송조회 버튼 직접 검사 "+autoButtonsDone+" / 결과 재사용 "+totalReusedButtons+" / 확인된 대상 "+autoButtonsTotal+
                      " · 목록 항목 단위 집계. 묶음 내 상품별 연결·전체 배송 보장 아님. 자동 저장·자동 전송 없음."+
                      (oneOrder.isEmpty()?"":"\n확인된 화면 배송정보: "+oneOrder));
                  if(resumeAvailable){
                      status.append("\n앱 실행 중 '남은 검사 이어하기'를 누르면 중지된 항목부터 다시 검사합니다. 기기 저장 없음.");
                  }
                  reportFinishedAt=System.currentTimeMillis();reportSummary=result.getText()+"\n"+status.getText();
                  if(!resumeAvailable){
                      detailQueue.clear();detailKeys.clear();detailLabels.clear();detailIds.clear();linkedResults.clear();orderCache.clear();autoSignature="";autoExpected="";
                  }
                  showReport();
              }
              private void nextAutoOrder(int run){
                  if(!autoRunning||run!=autoRun)return;
                  while(autoIndex<detailKeys.size()){
                      String key=detailKeys.get(autoIndex),link=detailQueue.get(key);
                      if(link==null||link.isEmpty()){
                          String label=detailLabels.get(key);if(label==null)label="목록 "+(autoIndex+1);
                          reportRows.add(new ReportRow(label,"링크 없음","허용된 네이버페이 주문상세 링크를 찾지 못함",null));
                          autoNoLink++;autoDone++;autoIndex++;continue;
                      }
                      reusedButtons=0;targetPresent=false;currentCacheKey="";changedRetries=0;
                      autoButtonIndex=0;autoButtonCount=-1;autoSignature="";autoRootPairs="";autoShipping=false;
                      autoOrderFailed=false;autoOrderUnbound=false;targetCancelled=false;orderReasons.clear();buttonNotes.clear();observedButtonPairs.clear();buttonNote="";
                      linkedResults.put(key,new java.util.LinkedHashSet<>());loadAutoPage(run,link);return;
                  }
                  stopAuto("자동 검사 완료");
              }
              private boolean reuseCachedOrder(int run,int count){
                  if(!autoRunning||run!=autoRun||targetCancelled)return false;
                  OrderCache cached=orderCache.get(currentCacheKey);
                  if(autoButtonIndex!=0||!targetPresent||autoOrderUnbound||autoOrderFailed||count<=0||cached==null)return false;
                  linkedResults.get(detailKeys.get(autoIndex)).addAll(cached.pairs);
                  buttonNotes.addAll(cached.notes);reusedButtons=count;totalReusedButtons+=count;autoButtonIndex=count;
                  orderReasons.add("이번 실행에서 검사 완료한 같은 주문상세·버튼 구성의 결과 재사용: "+cached.source+" · 상품별 송장 연결은 미확정");
                  completeAutoOrder(run);return true;
              }
              private void retryDetail(int run,String reason){
                  if(!autoRunning||run!=autoRun||browser==null)return;
                  String current=browser.getUrl()==null?"":browser.getUrl();
                  if(detailRetries<1&&sameAutoPage(current)){
                      detailRetries++;orderReasons.add(reason+" · 상세 재시도 1/1");
                      reloadAutoPage(run,autoExpected);return;
                  }
                  markUnbound(reason+(detailRetries>0?" · 상세 재시도 후에도 미확인":" · 주소 변경으로 재시도 제외"));completeAutoOrder(run);
              }
              private void loadAutoPage(int run,String address){detailRetries=0;changedRetries=0;reloadAutoPage(run,address);}
              private void reloadAutoPage(int run,String address){
                  if(!autoRunning||run!=autoRun||browser==null)return;
                  if(!safeAutoUrl(address)){markFailed("주문상세 링크 검증 실패");completeAutoOrder(run);return;}
                  autoExpected=address;autoReading=false;autoShipping=false;candidateSignature="";final int step=++autoStep;
                  status.setText("주문 "+(autoIndex+1)+"/"+detailKeys.size()+" · 상세 화면 로딩"+
                      (autoButtonCount>=0?" · 다음 배송조회 "+(autoButtonIndex+1)+"/"+autoButtonCount:""));
                  result.setText("처리 "+autoDone+"건 · 배송 확인 "+autoMatched+"건");
                  handler.postDelayed(()->{
                      if(autoRunning&&run==autoRun&&step==autoStep)retryDetail(run,"주문상세 응답 시간 초과");
                  },25000);
                  try{browser.loadUrl(address);}catch(Exception ignored){markFailed("상세 검사 실행·응답 검증 실패");completeAutoOrder(run);}
              }
              private void completeAutoOrder(int run){
                  if(!autoRunning||run!=autoRun)return;
                  java.util.Set<String> pairs=linkedResults.get(detailKeys.get(autoIndex));
                  if(targetCancelled)autoCancelled++;
                  else if(pairs!=null&&!pairs.isEmpty()){autoMatched++;if(autoOrderFailed)markUnbound("일부 검사 실패");}
                  else if(autoOrderFailed)autoFailed++;
                  else if(!autoOrderUnbound)autoMissing++;
                  if(autoOrderUnbound)autoUnbound++;
                  if(canCache()&&pairs!=null&&!pairs.isEmpty()&&orderCache.size()<5000){
                      orderCache.put(currentCacheKey,new OrderCache(pairs,buttonNotes,detailLabels.get(detailKeys.get(autoIndex))));
                  }
                  recordCurrentOrder(false);
                  autoDone++;autoIndex++;autoStep++;nextAutoOrder(run);
              }
              private void readAutoPairs(JSONObject d) throws Exception {
                  if(!d.optBoolean("ok"))throw new IllegalArgumentException();
                  JSONArray pairs=d.getJSONArray("domPairs");
                  if(pairs.length()>10)throw new IllegalArgumentException();
                  java.util.Set<String> connected=linkedResults.get(detailKeys.get(autoIndex));
                  String allowed="CJ대한통운|CJ 대한통운|대한통운|한진택배|한진|롯데택배|롯데|로젠택배|로젠|우체국택배|우체국|경동택배|경동|대신택배|대신|CU편의점택배|GSPostbox|GS postbox|컬리넥스트마일";
                  for(int i=0;i<pairs.length();i++){
                      JSONObject pair=pairs.getJSONObject(i);String company=pair.getString("carrier"),tail=pair.getString("tail");
                      if(!company.matches(allowed)||!tail.matches("컬리넥스트마일".equals(company)?"[A-Z0-9]{4}":"[0-9]{4}"))throw new IllegalArgumentException();
                      connected.add(company+" · ****"+tail);
                  }
                  if(d.optBoolean("limited"))markUnbound("배송정보 추출 한도 도달");
                  if(!connected.isEmpty())result.setText("현재 주문: "+android.text.TextUtils.join(" / ",connected));
              }
              private JSONObject decodeAuto(String ret) throws Exception {
                  if(ret==null||ret.length()>150000)throw new IllegalArgumentException();
                  Object value=new JSONArray("["+ret+"]").get(0);
                  if(!(value instanceof String))throw new IllegalArgumentException();
                  return new JSONObject((String)value);
              }
              private void pollAuto(int run,int step,int attempt){
                  handler.postDelayed(()->{
                      if(!autoRunning||run!=autoRun||step!=autoStep||browser==null||autoShipping)return;
                      if(!sameAutoPage(browser.getUrl()==null?"":browser.getUrl())){markUnbound("주문상세 주소 변경");completeAutoOrder(run);return;}
                      try{browser.evaluateJavascript(autoJs+"("+JSONObject.quote(detailIds.containsKey(detailKeys.get(autoIndex))?detailIds.get(detailKeys.get(autoIndex)):"")+")",ret->{
                          if(!autoRunning||run!=autoRun||step!=autoStep)return;
                          try{
                              if(!sameAutoPage(browser.getUrl()==null?"":browser.getUrl())){markUnbound("주문상세 주소 변경");completeAutoOrder(run);return;}
                              JSONObject d=decodeAuto(ret);if(!d.optBoolean("ok"))throw new IllegalArgumentException();
                              JSONArray keys=d.getJSONArray("controlKeys");int count=keys.length();
                              targetPresent=d.optBoolean("targetPresent");
                              if(!d.optBoolean("targetCancelled")&&count==0&&d.getJSONArray("domPairs").length()==0&&attempt<4){pollAuto(run,step,attempt+1);return;}
                              if(d.optBoolean("targetCancelled")){
                                  targetCancelled=true;autoButtonCount=0;
                                  orderReasons.add("현재 상품주문키와 같은 상품 영역에서 취소완료 확인 · 해당 영역에 배송조회 버튼 없음");
                                  completeAutoOrder(run);return;
                              }
                              if(detailIds.containsKey(detailKeys.get(autoIndex))&&!targetPresent){
                                  if(attempt<4){pollAuto(run,step,attempt+1);return;}
                                  retryDetail(run,"대상 상품 영역 로딩 미확인");return;
                              }
                              if(d.optBoolean("cancelLimited"))orderReasons.add("취소 상태 영역 검사 한도 도달 · 제외 판정 안 함");
                              if(d.optBoolean("cancelAmbiguous"))orderReasons.add("동일 상품주문키 영역이 여러 개 · 취소 제외 판정 안 함");
                              readAutoPairs(d);
                              if(d.optBoolean("controlLimited")){markUnbound("배송조회 버튼 검사 한도 초과");completeAutoOrder(run);return;}
                              if(d.optInt("blockedControls")>0)markUnbound("자동 실행 제외 버튼 "+d.optInt("blockedControls")+"개 (외부 링크·새 창 등)");
                              String signature=keys.toString();
                              if(!signature.equals(candidateSignature)){
                                  candidateSignature=signature;
                                  if(attempt<5)pollAuto(run,step,attempt+1);else retryDetail(run,"배송조회 버튼 구성 안정화 대기 초과");
                                  return;
                              }
                              if(autoButtonCount<0){autoButtonCount=count;autoSignature=signature;autoRootPairs=d.getJSONArray("domPairs").toString();autoButtonsTotal+=count;}
                              else if(autoButtonCount!=count||!autoSignature.equals(signature)){
                                  if(changedRetries++<2){pollAuto(run,step,attempt+1);return;}
                                  retryDetail(run,"주문상세 복귀 후 버튼 구성·상품 식별 변경");return;
                              }
                              currentCacheKey=autoExpected+"\n"+signature;
                              if(reuseCachedOrder(run,count))return;
                              if(autoButtonIndex>=count){
                                  if(count==0&&d.getJSONArray("domPairs").length()==0)
                                      orderReasons.add("상세 화면 배송조회 버튼 0개 · 택배사/번호 조합 미검출 · "+diagnosticCounts(d));
                                  completeAutoOrder(run);return;
                              }
                              clickAutoControl(run);
                          }catch(Exception ignored){
                              if(attempt<3){pollAuto(run,step,attempt+1);return;}
                              retryDetail(run,"상세 검사 응답 미확인");
                          }
                      });}catch(Exception ignored){retryDetail(run,"상세 검사 실행 실패");}
                  },1200);
              }
              private void clickAutoControl(int run){
                  if(!autoRunning||run!=autoRun||browser==null)return;
                  autoShipping=true;autoReading=true;buttonNote="응답 대기 중";final int step=++autoStep;
                  status.setText("주문 "+(autoIndex+1)+"/"+detailKeys.size()+" · 배송조회 "+(autoButtonIndex+1)+"/"+autoButtonCount);
                  handler.postDelayed(()->{
                      if(autoRunning&&run==autoRun&&step==autoStep){markUnbound("배송조회 응답 시간 초과");buttonNote="응답 시간 초과";finishAutoShipping(run);}
                  },25000);
                  String script=clickControlJs+"("+JSONObject.quote(autoExpected)+","+JSONObject.quote(autoSignature)+","+autoButtonIndex+")";
                  try{browser.evaluateJavascript(script,ret->{
                      if(!autoRunning||run!=autoRun||step!=autoStep)return;
                      try{
                          if(!"CLICKED".equals(decodeAuto(ret).optString("state"))){buttonNote="실행 전 화면·버튼 변경 또는 실행 실패";markUnbound("배송조회 버튼 실행 전 검증 실패");completeAutoOrder(run);return;}
                          pollAutoShipping(run,step,0);
                      }catch(Exception ignored){buttonNote="실행·응답 검증 실패";markFailed("배송조회 버튼 실행·응답 검증 실패");completeAutoOrder(run);}
                  });}catch(Exception ignored){buttonNote="실행·응답 검증 실패";markFailed("배송조회 버튼 실행·응답 검증 실패");completeAutoOrder(run);}
              }
              private void pollAutoShipping(int run,int step,int attempt){
                  handler.postDelayed(()->{
                      if(!autoRunning||run!=autoRun||step!=autoStep||browser==null)return;
                      final String page=browser.getUrl()==null?"":browser.getUrl();
                      if(!safeAutoUrl(page)){stopAuto("로그인 또는 외부 화면으로 이동 · 부분 결과");return;}
                      try{browser.evaluateJavascript(detailJs,ret->{
                          if(!autoRunning||run!=autoRun||step!=autoStep)return;
                          try{
                              if(!page.equals(browser.getUrl())){if(attempt<11){pollAutoShipping(run,step,attempt+1);return;}markUnbound("배송조회 로딩 중 주소 변경 지속");buttonNote="주소 변경 지속";finishAutoShipping(run);return;}
                              JSONObject d=decodeAuto(ret);if(!d.optBoolean("ok"))throw new IllegalArgumentException();
                              if(d.getJSONArray("domPairs").length()==0&&attempt<11){pollAutoShipping(run,step,attempt+1);return;}
                              readAutoPairs(d);
                              String found=pairsText(d);
                              buttonNote=found.isEmpty()?"택배사/번호 조합 미검출":found;
                              if(!found.isEmpty()&&!observedButtonPairs.add(found))buttonNote+=" (앞 버튼과 표시 정보 같음 · 동일 송장 여부 미확정)";
                              if(found.isEmpty())markUnbound("배송조회 "+(autoButtonIndex+1)+" · 화면 배송정보 미검출 · "+diagnosticCounts(d)+" · 화면호스트 "+safeHost(page));
                              if(sameAutoPage(page)&&autoRootPairs.equals(d.getJSONArray("domPairs").toString()))markUnbound("배송조회 실행 후 화면 전환 미확인");
                              finishAutoShipping(run);
                          }catch(Exception ignored){markFailed("배송조회 실행·응답 검증 실패");buttonNote="응답 검증 실패";finishAutoShipping(run);}
                      });}catch(Exception ignored){markFailed("배송조회 실행·응답 검증 실패");buttonNote="응답 검증 실패";finishAutoShipping(run);}
                  },1200);
              }
              private void finishAutoShipping(int run){
                  if(!autoRunning||run!=autoRun)return;
                  buttonNotes.add("배송조회 "+(autoButtonIndex+1)+": "+buttonNote);
                  autoButtonsDone++;autoButtonIndex++;autoStep++;autoShipping=false;
                  if(autoButtonIndex<autoButtonCount)loadAutoPage(run,autoExpected);else completeAutoOrder(run);
              }
              @Override public void onBackPressed(){
                  ++entrySeq;
                  if(diagnosticScroll.getVisibility()==View.VISIBLE){closeDiagnostics();return;}
                  if(autoRunning){stopAuto("뒤로가기로 중지 · 부분 결과");return;}
                  if(sweeping){stopSweep("뒤로가기로 중지 · 부분 결과");return;}
                  if(browser!=null&&browser.canGoBack())browser.goBack();else super.onBackPressed();
              }
              @Override protected void onDestroy(){
                  autoRunning=false;autoRun++;orderCache.clear();detailQueue.clear();linkedResults.clear();detailLabels.clear();detailIds.clear();reportRows.clear();pendingExportText=null;
                  sweeping=false;sweepRun++;sweepKeys.clear();
                  handler.removeCallbacksAndMessages(null);
                  if(browser!=null){browser.stopLoading();browser.destroy();browser=null;}
                  super.onDestroy();
              }
