name: Inspect Deskhero pages

on:
  push:
    branches: [feature/deskhero-watcher]
    paths:
      - '.github/workflows/deskhero-inspect.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Inspect Deskhero rows and duplicates
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const pages=[
            ['Keyboard','https://help.deskhero.ca/en-US/group-buypreorder-keyboard-updates-4856504'],
            ['Keyset','https://help.deskhero.ca/en-US/group-buypreorder-keyset-updates-4855831'],
            ['Deskmat','https://help.deskhero.ca/en-US/group-buypreorder-deskmat-updates-4855887'],
            ['Accessory','https://help.deskhero.ca/en-US/group-buypreorder-accessories-updates-4856503']
          ];
          const decode=s=>String(s??'')
            .replace(/&#x([0-9a-f]+);/gi,(_,h)=>String.fromCodePoint(parseInt(h,16)))
            .replace(/&#(\d+);/g,(_,d)=>String.fromCodePoint(parseInt(d,10)))
            .replace(/&nbsp;/gi,' ').replace(/&amp;/gi,'&').replace(/&quot;/gi,'"')
            .replace(/&#39;|&apos;/gi,"'").replace(/&lt;/gi,'<').replace(/&gt;/gi,'>');
          const text=s=>decode(String(s??'').replace(/<br\s*\/?>/gi,' ').replace(/<[^>]+>/g,' ')).replace(/\s+/g,' ').trim();
          for(const [category,url] of pages){
            const res=await fetch(url,{headers:{accept:'text/html','user-agent':'keyboard-alert/1.0 (+https://github.com/techhun/keyboard-alert)'},signal:AbortSignal.timeout(15000)});
            if(!res.ok) throw new Error(category+' HTTP '+res.status);
            const html=await res.text();
            const table=(html.match(/<table\b[\s\S]*?<\/table>/i)||[])[0]||'';
            const raw=[];
            for(const m of table.matchAll(/<tr\b[^>]*>([\s\S]*?)<\/tr>/gi)){
              const cells=[...m[1].matchAll(/<td\b[^>]*>([\s\S]*?)<\/td>/gi)].map(x=>text(x[1]));
              if(cells.length<2) continue;
              const [product,status]=cells;
              if(!product||!status||/product name/i.test(product)) continue;
              raw.push({product,status});
            }
            const by=new Map();
            for(const row of raw){
              const key=row.product.toLowerCase().replace(/\s+/g,' ').trim();
              if(!by.has(key)) by.set(key,[]);
              by.get(key).push(row.status);
            }
            const dup=[...by.entries()].filter(([,v])=>v.length>1);
            console.log('\n=== '+category+' ===');
            console.log('HTTP rows='+raw.length+' uniqueProducts='+by.size+' duplicates='+dup.length+' bytes='+html.length);
            for(const [product,statuses] of dup.slice(0,30)){
              console.log('DUP '+product+' => '+JSON.stringify(statuses));
            }
          }
          NODE
