name: Schedule watcher regression tests

on:
  push:
    branches: [main]
    paths:
      - 'scripts/check-geonworks.mjs'
      - 'scripts/check-geonworks-release.mjs'
      - 'scripts/geonworks-safety.mjs'
      - 'tests/geonworks-safety.test.mjs'
      - 'scripts/check-oblotzky.mjs'
      - 'scripts/oblotzky-safety.mjs'
      - 'tests/oblotzky-safety.test.mjs'
      - 'scripts/check-novelkeys.mjs'
      - 'scripts/novelkeys-safety.mjs'
      - 'tests/novelkeys-safety.test.mjs'
      - 'scripts/check-kbdfans.mjs'
      - 'scripts/kbdfans-safety.mjs'
      - 'tests/kbdfans-safety.test.mjs'
      - 'scripts/check-cannonkeys.mjs'
      - 'scripts/cannonkeys-safety.mjs'
      - 'tests/cannonkeys-safety.test.mjs'
      - 'scripts/check-deskhero.mjs'
      - 'scripts/deskhero-safety.mjs'
      - 'tests/deskhero-safety.test.mjs'
      - 'scripts/check-omnitype.mjs'
      - 'scripts/omnitype-safety.mjs'
      - 'tests/omnitype-safety.test.mjs'
      - 'scripts/system-health.mjs'
      - 'tests/system-health-safety.test.mjs'
      - 'scripts/check-workflow-watchdog.mjs'
      - 'tests/workflow-watchdog.test.mjs'
      - '.github/workflows/keyboard-alert-watchdog.yml'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/geonworks-tests.yml'
  pull_request:
    paths:
      - 'scripts/check-geonworks.mjs'
      - 'scripts/check-geonworks-release.mjs'
      - 'scripts/geonworks-safety.mjs'
      - 'tests/geonworks-safety.test.mjs'
      - 'scripts/check-oblotzky.mjs'
      - 'scripts/oblotzky-safety.mjs'
      - 'tests/oblotzky-safety.test.mjs'
      - 'scripts/check-novelkeys.mjs'
      - 'scripts/novelkeys-safety.mjs'
      - 'tests/novelkeys-safety.test.mjs'
      - 'scripts/check-kbdfans.mjs'
      - 'scripts/kbdfans-safety.mjs'
      - 'tests/kbdfans-safety.test.mjs'
      - 'scripts/check-cannonkeys.mjs'
      - 'scripts/cannonkeys-safety.mjs'
      - 'tests/cannonkeys-safety.test.mjs'
      - 'scripts/check-deskhero.mjs'
      - 'scripts/deskhero-safety.mjs'
      - 'tests/deskhero-safety.test.mjs'
      - 'scripts/check-omnitype.mjs'
      - 'scripts/omnitype-safety.mjs'
      - 'tests/omnitype-safety.test.mjs'
      - 'scripts/system-health.mjs'
      - 'tests/system-health-safety.test.mjs'
      - 'scripts/check-workflow-watchdog.mjs'
      - 'tests/workflow-watchdog.test.mjs'
      - '.github/workflows/keyboard-alert-watchdog.yml'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/geonworks-tests.yml'

permissions:
  actions: read
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run regression tests
        run: npm test
      - name: Smoke check workflow watchdog
        env:
          WATCHDOG_GITHUB_TOKEN: ${{ github.token }}
        run: npm run check:watchdog
      - name: Smoke check GEONWORKS GB
        run: npm run check:geonworks
      - name: Smoke check GEONWORKS Release
        run: npm run check:geonworks-release
      - name: Smoke check Oblotzky Schedule
        run: npm run check:oblotzky
      - name: Smoke check NovelKeys Product Updates
        run: npm run check:novelkeys
      - name: Smoke check KBDfans Product Updates
        run: npm run check:kbdfans
      - name: Smoke check CannonKeys Project Updates
        run: npm run check:cannonkeys
      - name: Smoke check Deskhero Group Buy/Preorder Updates
        run: npm run check:deskhero
      - name: Smoke check Omnitype Product Updates
        run: npm run check:omnitype
