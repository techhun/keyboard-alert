name: Inspect Omnitype product updates

on:
  push:
    branches: [feature/omnitype-watcher]
    paths:
      - '.github/workflows/omnitype-inspect.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Inspect Omnitype Product Updates HTML
        shell: bash
        run: |
          set -euo pipefail
          url="https://omnitype.com/pages/product-updates"
          file="/tmp/omnitype.html"
          curl -fsSL --retry 3 --retry-all-errors             -A 'keyboard-alert/1.0 (+https://github.com/techhun/keyboard-alert)'             "$url" -o "$file"

          echo "bytes=$(wc -c < "$file")"
          echo "buttons=$(grep -o '<button\\b' "$file" | wc -l)"
          echo "details=$(grep -o '<details\\b' "$file" | wc -l)"
          echo "summary=$(grep -o '<summary\\b' "$file" | wc -l)"
          echo "li=$(grep -o '<li\\b' "$file" | wc -l)"

          node - "$file" <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync(process.argv[2],'utf8');
          for (const needle of ['Enso-E','Float 65','Bauer 65','RF-8X','Wing','Updated delivery time','Housings - delayed']) {
            const i=html.indexOf(needle);
            if(i>=0) {
              console.log('\n['+needle+']');
              console.log(html.slice(Math.max(0,i-1200),i+3500).replace(/\s+/g,' '));
            }
          }
          NODE
