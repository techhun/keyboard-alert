name: Temp Restock SmartStore Probe

on:
  push:
    paths:
      - ".github/workflows/restock-smartstore-probe.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe SmartStore rendered page
        shell: bash
        run: |
          set -euo pipefail
          URL="https://m.smartstore.naver.com/geonlab/products/13717190771"
          echo "URL=$URL"
          curl -L -sS -o /tmp/curl.html -w 'curl_http=%{http_code} bytes=%{size_download}\n' "$URL" || true

          CHROME="$(command -v google-chrome || command -v chromium-browser || command -v chromium || true)"
          echo "chrome=$CHROME"
          if [ -n "$CHROME" ]; then
            "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage               --virtual-time-budget=15000 --dump-dom "$URL" > /tmp/dom.html 2>/tmp/chrome.err || true
          else
            cp /tmp/curl.html /tmp/dom.html
          fi

          python3 - <<'PY'
          import re
          from pathlib import Path

          for label, path in [("curl", "/tmp/curl.html"), ("dom", "/tmp/dom.html")]:
              text = Path(path).read_text("utf-8", errors="ignore") if Path(path).exists() else ""
              print(f"--- {label} bytes={len(text)} ---")
              title = re.search(r"<title[^>]*>(.*?)</title>", text, re.I | re.S)
              print("title=", re.sub(r"\s+", " ", title.group(1)).strip()[:200] if title else "")
              for needle in [
                  "13717190771", "optionCombinations", "optionSimple", "optionInfo",
                  "stockQuantity", "channelProductNo", "originProduct", "__NEXT_DATA__",
                  "__PRELOADED_STATE__", "channelUid"
              ]:
                  positions = [m.start() for m in re.finditer(re.escape(needle), text, re.I)]
                  print(f"{needle}: count={len(positions)}")
                  for pos in positions[:3]:
                      snippet = re.sub(r"\s+", " ", text[max(0,pos-350):pos+900])
                      print("  ", snippet[:1250])
          PY

          if [ -s /tmp/chrome.err ]; then
            echo "--- chrome stderr tail ---"
            tail -n 30 /tmp/chrome.err
          fi
