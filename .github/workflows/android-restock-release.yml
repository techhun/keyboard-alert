name: Android Restock Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - fix/restock-option-query
      - fix/restock-recovery-observability
    paths:
      - 'android/restock-worker/**'
      - 'tests/restock-inventory-status.test.mjs'
      - 'tests/restock-page-capture.test.mjs'
      - '.github/workflows/android-restock-release.yml'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: android/restock-worker

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'

      - name: Restore release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.RESTOCK_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RESTOCK_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RESTOCK_RELEASE_KEY_ALIAS }}
        shell: bash
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "RESTOCK_RELEASE_KEYSTORE_BASE64 is missing"; exit 1; }
          test -n "$STORE_PASSWORD" || { echo "RESTOCK_RELEASE_STORE_PASSWORD is missing"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "RESTOCK_RELEASE_KEY_ALIAS is missing"; exit 1; }

          keystore_path="$RUNNER_TEMP/restock-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore_path"

          echo "RESTOCK_KEYSTORE_PATH=$keystore_path" >> "$GITHUB_ENV"
          echo "RESTOCK_KEYSTORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "RESTOCK_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          # The release keystore is PKCS12. PKCS12 uses the store password
          # for the private key as well, so keep Gradle signing consistent.
          echo "RESTOCK_KEY_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"

      - name: Verify release signing credentials
        shell: bash
        run: |
          verify_store="$RUNNER_TEMP/signing-verify.p12"
          rm -f "$verify_store"
          if ! keytool -importkeystore \
            -srckeystore "$RESTOCK_KEYSTORE_PATH" \
            -srcstorepass "$RESTOCK_KEYSTORE_PASSWORD" \
            -srcalias "$RESTOCK_KEY_ALIAS" \
            -srckeypass "$RESTOCK_KEYSTORE_PASSWORD" \
            -destkeystore "$verify_store" \
            -deststoretype PKCS12 \
            -deststorepass "RestockVerify123!" \
            -destkeypass "RestockVerify123!" \
            -noprompt >/dev/null 2>&1; then
            echo "::error::Release signing credentials do not match the keystore. Recheck RESTOCK_RELEASE_KEYSTORE_BASE64, RESTOCK_RELEASE_STORE_PASSWORD, and RESTOCK_RELEASE_KEY_ALIAS."
            exit 1
          fi
          rm -f "$verify_store"

      - name: Verify SmartStore inventory status behavior
        run: node --test ../../tests/restock-inventory-status.test.mjs ../../tests/restock-page-capture.test.mjs

      - name: Test, lint and build signed release APK
        run: gradle :app:testDebugUnitTest :app:lintRelease :app:assembleRelease --stacktrace

      - name: Upload release APK
        uses: actions/upload-artifact@v7
        with:
          name: restock-worker-release-apk
          path: android/restock-worker/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload release lint report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: restock-worker-release-lint
          path: android/restock-worker/app/build/reports/lint-results-release.*
          if-no-files-found: warn
          retention-days: 30

  # One-time direct APK publication; subsequent source pushes keep building
  # artifacts and do not automatically publish a release.
  publish_v01443:
    needs: release
    if: github.event_name == 'push' && github.ref == 'refs/heads/fix/restock-recovery-observability' && github.event.head_commit.message == 'ci(restock): publish signed v0.14.43 APK to GitHub Releases'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the verified signed Release APK
        uses: actions/download-artifact@v7
        with:
          name: restock-worker-release-apk
          path: dist

      - name: Publish an APK directly to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/app-release.apk
          sha256sum dist/app-release.apk
          tag=restock-v0.14.43
          asset=Restock-v0.14.43.apk
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets >/dev/null 2>&1; then
            gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fx "$asset"
            echo "Release and APK asset already exist."
            exit 0
          fi
          gh release create "$tag" "dist/app-release.apk#$asset" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Restock v0.14.43" \
            --notes "Signed Android APK for Restock v0.14.43 (versionCode 77). SmartStore static-resource cache optimization and page resource diagnostics; monitoring interval unchanged. Existing app data is preserved on update when the signing key matches." \
            --latest=false
